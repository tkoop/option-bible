<!doctype html>

		<script>
			// The app answers on bible.trth.app; any other domain is sent
			// there whole - path, query and hash with it, so a shared chapter
			// link ("#Gen-1?s=us&n=YHWH") survives the hop. Localhost names
			// and IP addresses stay put: that is how the app is reached while
			// it is developed and tested (npm run serve, Cypress, and
			// tools/testPushUi.mjs, which visits 127.0.0.1).
			(function () {
				var host = window.location.hostname;
				var local =
					host === "localhost" ||
					host.endsWith(".localhost") ||
					host.includes(":") ||
					/^\d{1,3}(\.\d{1,3}){3}$/.test(host);
				if (local || host === "bible.trth.app") return;
				window.location.replace(
					"https://bible.trth.app" +
						window.location.pathname +
						window.location.search +
						window.location.hash,
				);
			})();
		</script>

	<script>
		async function loadComponents() {
			await loadComponent("dropdown", "components/menu.html?version=16");
			await loadComponent("chapter", "components/chapter.html?version=63");
			await loadComponent("word", "components/word.html?version=6");
			await loadComponent("home", "components/home.html?version=12");
			await loadComponent("plans", "components/plans.html?version=14");
			await loadComponent("plan", "components/plan.html?version=6");
			await loadComponent("about", "components/about.html?version=4");
			await loadComponent("history", "components/history.html?version=5");
			await loadComponent("search", "components/search.html?version=10");
			await loadComponent(
				"settingsDropdown",
				"components/settings.html?version=16"
			);
			await loadComponent("advancedDropdown", "components/advanced.html?version=2");
await loadComponent("speedReader", "components/speedReader.html?version=10");
		await loadComponent("readToMe", "components/readToMe.html?version=7");
		await loadComponent("sharePanel", "components/share.html?version=2");
		}
		loadComponents().then(() => {
			// A URL that arrives with a fragment gets a popstate before any of this
			// is here to handle it - the chapter fetcher lives in a component - so
			// the router stays shut until now, and the initial location is routed
			// by hand below.
			window.__routerReady = true;

			// If the user already navigated while components were loading, the
			// chapter/render is in flight; don't clobber it.
			if (window.__userNavigated) return;
			var hash = window.location.hash || "#";
			history.replaceState(hash, "", hash);
			updatePage(hash);
		});

		// Moving to another hash reaches the router here: a history back, a
		// chapter link, a shared link pasted into the address bar. The move is
		// reported twice - popstate, then hashchange, and for a link the state is
		// empty - so the hash is read from the location, which is the one thing
		// both events agree on, and the pair is handled once.
		let fromHistory = false;
		function routeLocation() {
			if (!window.__routerReady) return;
			updatePage(window.location.hash || "#");
		}

		window.addEventListener("popstate", () => {
			fromHistory = true;
			routeLocation();
			// The pair arrives together, so the mark only has to outlive it.
			setTimeout(() => {
				fromHistory = false;
			}, 0);
		});

		window.addEventListener("hashchange", () => {
			if (fromHistory) return;
			routeLocation();
		});

		function updatePage(state) {
			if (state === "#") {
				fireEvent({ name: "showPage", page: "home", skipHistory: true });
			} else if (state === "#index") {
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			} else if (state === "#plans") {
				fireEvent({ name: "showPage", page: "plans", skipHistory: true });
			} else if (state === "#history") {
				fireEvent({ name: "showPage", page: "history", skipHistory: true });
			} else if (state === "#search") {
				fireEvent({ name: "showPage", page: "search", skipHistory: true });
			} else if (state === "#about") {
				fireEvent({ name: "showPage", page: "about", skipHistory: true });
			} else if (state.startsWith("#plan/")) {
				// One plan laid out day by day. Like a word study, the hash names
				// what the page is about and the page reads it back from there, so
				// it comes before the chapter branch below - that one takes any hash
				// starting with a "#".
				showPlanPage(state.slice("#plan/".length));
			} else if (state.startsWith("#word/")) {
				// A word study, "#word/G2424". It comes before the chapter branch
				// below because that one reads anything that starts with a "#",
				// and it hands the whole hash over - a word hash carries no shared
				// settings, so there is no query to strip and nothing to apply.
				showWordPage(state.slice("#word/".length));
			} else if (state && state.startsWith("#")) {
				// A chapter hash, which a shared link extends with the settings
				// that make up the version: "#Gen-1?s=us&n=YHWH&c=upper&y=youall".
				// They go in before the chapter is fetched, so it renders as it
				// was shared; a hash without them hands the reader their own back.
				var queryAt = state.indexOf("?");
				applySharedSettings(queryAt == -1 ? "" : state.slice(queryAt));
				const hash = (queryAt == -1 ? state : state.slice(0, queryAt)).slice(1); // remove #
				const parts = hash.split("-");
				const abbr = parts[0].toUpperCase();
				const chapter = parts.slice(1).join("-");
				const book = books.find((b) => b.abbr.toUpperCase() === abbr);
				if (book && chapter) {
					loadURL(chapterUrl(book.slug, chapter), true);
				} else {
					// invalid hash, go to home
					fireEvent({ name: "showPage", page: "home", skipHistory: true });
				}
			} else {
				// fallback to home
				fireEvent({ name: "showPage", page: "home", skipHistory: true });
			}
		}

		const darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
		function applyMode() {
			var useDark =
				settings.mode === "auto"
					? darkModeQuery.matches
					: settings.mode === "dark";
			document.body.classList.toggle("dark", useDark);
		}
		darkModeQuery.addEventListener("change", applyMode);
		applyMode();

		// The reading font lives in CSS (body[data-font]); this only tags the body
		// so scripture text picks up the chosen stack everywhere at once.
		function applyFont() {
			document.body.dataset.font = settings.font || "sourceSerif";
		}
		applyFont();

		registerEventListener(
			(event) => event.name == "settingsUpdated",
			function (event) {
				applyMode();
				applyFont();
			},
		);

		registerEventListener(
			(event) => event.name == "showPage",
			function (event) {
				// Published first, so listeners further down the fan-out (the
				// chapter-only gear and advanced menus) see the new page.
				window.currentPage = event.page;
				if (!event.skipHistory) {
					let hash;
					if (event.page === "home") hash = "#";
					else if (event.page === "index") hash = "#index";
					else if (event.page === "plans") hash = "#plans";
					else if (event.page === "history") hash = "#history";
					else if (event.page === "search") hash = "#search";
					else if (event.page === "about") hash = "#about";
					else if (event.page === "plan") hash = "#" + event.hash;
					else if (event.page === "word") hash = "#" + event.hash;
					else if (event.page === "chapter") hash = "#" + event.hash;
					history.pushState(hash, "", hash);
				}
				document
					.querySelectorAll(".page")
					.forEach((e) => (e.style.display = "none"));
				var page = document.getElementById(event.page);
				page.style.display =
					event.page === "index" ||
					(event.page === "chapter" &&
						page.classList.contains("page-turn"))
						? "flex"
						: "block";
				window.scrollTo(0, 0);
				return;
			},
		);
	</script>

	<script>
		if (window.location.hostname != "localhost") {
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker
						.register("./serviceWorker.js?version=5", {
							scope: "./",
						})
						.then(
							function (registration) {
								console.log(
									"ServiceWorker registered successfully, scope: ",
									registration.scope,
								);
							},
							function (err) {
								console.log("ServiceWorker registration failed: ", err);
							},
						);
					window.IS_STANDALONE = window.matchMedia(
						"(display-mode: standalone)",
					).matches;
				});
			}
		}
	</script>
	<div id="slashJump" class="slash-jump" hidden>
		<div class="slash-jump-backdrop" id="slashJumpBackdrop"></div>
		<div class="slash-jump-dialog" role="dialog" aria-modal="true">
			<h2 class="slash-jump-title">Quick jump</h2>
			<input
				id="slashJumpInput"
				type="text"
				class="slash-jump-input"
				placeholder="Go to a chapter or search..."
				autocomplete="off"
				spellcheck="false"
			/>
			<p class="slash-jump-hint">Type a Bible reference (e.g. John 3:16) or any word to search.</p>
			<p id="slashJumpStatus" class="slash-jump-status">
				<span id="slashJumpSpinner" class="slash-jump-spinner" hidden></span>
				<span id="slashJumpStatusText"></span>
			</p>
		</div>
	</div>

	<script>
		(function () {
			var overlay = document.getElementById("slashJump");
			var input = document.getElementById("slashJumpInput");
			var backdrop = document.getElementById("slashJumpBackdrop");
			var status = document.getElementById("slashJumpStatus");
			var statusText = document.getElementById("slashJumpStatusText");
			var spinner = document.getElementById("slashJumpSpinner");
			function updateSlashStatus() {
				var value = (input.value || "").trim();
				if (!value) {
					statusText.textContent = "";
					return;
				}
				var suggestions =
					typeof refSuggestions === "function"
						? refSuggestions(value, 1)
						: [];
				if (suggestions && suggestions.length) {
					statusText.textContent = "Reference: " + suggestions[0].label;
				} else {
					statusText.textContent = "Text search: " + value;
				}
			}
			function openSlashJump() {
				overlay.hidden = false;
				input.value = "";
				statusText.textContent = "";
				if (spinner) spinner.hidden = true;
				input.disabled = false;
				setTimeout(function () {
					input.focus();
				}, 0);
			}
			function closeSlashJump() {
				overlay.hidden = true;
			}
			if (backdrop)
				backdrop.addEventListener("click", closeSlashJump);
			input.addEventListener("input", updateSlashStatus);
			input.addEventListener("keydown", function (event) {
				if (event.key === "Enter") {
					var value = input.value.trim();
					if (!value) {
						closeSlashJump();
						return;
					}
					var suggestions =
						typeof refSuggestions === "function"
							? refSuggestions(value, 1)
							: [];
					if (suggestions && suggestions.length) {
						closeSlashJump();
						var ref = suggestions[0];
						if (ref.verse) {
							window.scrollVerse = ref.verse;
							window.pendingHighlight = {
								verse: ref.verse,
								label: ref.label,
							};
						}
						if (typeof loadThisChapter === "function") {
							loadThisChapter(ref.book.name, ref.book.slug, ref.chapter);
						}
					} else {
						// A plain word search: the reader is taken straight to
						// the first match, with the rest of them a step away.
						if (typeof runSearch !== "function") {
							closeSlashJump();
							window.pendingSearchQuery = value;
							fireEvent({ name: "showPage", page: "search" });
							return;
						}
						// Keep the dialog open with a spinner so the reader knows
						// the (possibly large) search index is still loading.
						statusText.textContent = "Searching\u2026";
						if (spinner) spinner.hidden = false;
						input.disabled = true;
						runSearch(value, true)
							.then(function (hits) {
								if (spinner) spinner.hidden = true;
								input.disabled = false;
								closeSlashJump();
								if (!hits || !hits.length) {
									// Nothing to go to, so the results page shows
									// the search and the fact that it found nothing.
									window.pendingSearchQuery = value;
									fireEvent({ name: "showPage", page: "search" });
									return;
								}
								if (typeof openVerse === "function") {
									openVerse(hits[0]);
								} else {
									window.pendingSearchQuery = value;
									fireEvent({ name: "showPage", page: "search" });
								}
							})
							.catch(function () {
								if (spinner) spinner.hidden = true;
								input.disabled = false;
								closeSlashJump();
								window.pendingSearchQuery = value;
								fireEvent({ name: "showPage", page: "search" });
							});
					}
				} else if (event.key === "Escape") {
					closeSlashJump();
				}
			});
			document.addEventListener("keydown", function (event) {
				if (
					event.key === "/" &&
					!event.ctrlKey &&
					!event.metaKey &&
					!event.altKey
				) {
					var tag = event.target && event.target.tagName;
					if (
						tag === "INPUT" ||
						tag === "TEXTAREA" ||
						(event.target && event.target.isContentEditable)
					)
						return;
					event.preventDefault();
					openSlashJump();
				}
			});
		})();
	</script>
