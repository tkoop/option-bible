<p class="hdg">Praise God at Night</p>
<p><span class="reftext" id="v1">1</span>Look! All <span class="youpl" data-word="you">you</span> servants of <span class="lord" data-name="the LORD">the LORD</span>, praise <span class="lord" data-name="the LORD">the LORD</span> at night in <span class='cap'>His</span><span class='nocap'>his</span><span class='bsb'>His</span> house. <span class="reftext" id="v2">2</span>Lift up <span class="youpl" data-word="your">your</span> hands in the holy place and bless <span class="lord" data-name="the LORD">the LORD</span>. <span class="reftext" id="v3">3</span>May <span class="lord" data-name="The LORD"><span class='cap'>The</span><span class='nocap'>the</span><span class='bsb'>The</span> LORD</span> bless <span class="yousg" data-word="you">you</span> from Zion. He made <span class='nocap'>Heaven</span><span class='cap'>heaven</span><span class='bsb'>heaven</span> and <span class='nocap'>Earth</span><span class='cap'>Earth</span><span class='bsb'>earth</span>.</p>
