<p class="hdg">Praise the LORD, Everyone</p>
<p><span class="reftext" id="v1">1</span>Praise <span class="lord" data-name="the LORD">the LORD</span>, all nations. Praise <span class='cap'>Him</span><span class='nocap'>him</span><span class='bsb'>Him</span>, all peoples. <span class="reftext" id="v2">2</span>For great is <span class='cap'>His</span><span class='nocap'>his</span><span class='bsb'>His</span> faithful love toward us, and the truth of <span class="lord" data-name="the LORD">the LORD</span> lasts forever. Praise the LORD!</p>
