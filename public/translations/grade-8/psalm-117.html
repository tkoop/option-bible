<div class="calibre2"><p class="hdg">Praise the Lord, All Nations</p><p><span class="reftext" id="v1">1</span>Praise <span class="lord" data-name="the LORD">the LORD</span>, all nations. Praise <span class='cap'>Him</span><span class='nocap'>him</span><span class='bsb'>Him</span>, all peoples.</p><p><span class="reftext" id="v2">2</span>His faithful love for us is strong, and <span class="lord" data-name="the LORD">the LORD</span>'s truth lasts forever. Praise <span class="lord" data-name="the LORD">the LORD</span>!</p></div>
