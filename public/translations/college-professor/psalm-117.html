<p class="hdg">A Universal Summons to Praise the LORD</p>
<p><span class="reftext" id="v1">1</span>Praise <span class="lord" data-name="the LORD">the LORD</span>, all nations; extol <span class='cap'>Him</span><span class='nocap'>him</span><span class='bsb'>Him</span>, all peoples. <span class="reftext" id="v2">2</span>For <span class='cap'>His</span><span class='nocap'>his</span><span class='bsb'>His</span> steadfast love has prevailed over us, and the truth of <span class="lord" data-name="the LORD">the LORD</span> endures forever. Praise <span class="lord" data-name="the LORD">the LORD</span>.</p>
