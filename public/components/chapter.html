			wrapNodeRanges(node, [[0, node.nodeValue.length]], "mark", "chapter-hl");
			count++;
		});
		return count;
	}

	function unwrapHighlights() {
		var text = document.getElementById("chapterText");
		if (!text) return;
		Array.prototype.slice
			.call(text.querySelectorAll(".chapter-hl"))
			.forEach(function (mark) {
				var parent = mark.parentNode;
				while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
				parent.removeChild(mark);
			});
	}

	// The text the reader can see, and nothing else. applySettings hides the
	// spelling and case variants that are not on screen - the same words three
	// times over - so only the one that is left is worth marking, and the
	// footnote letters are apparatus rather than the words of the chapter.
	function highlightableTextNodes(root) {
		var nodes = [];
		var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
			acceptNode: function (node) {
				if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
				for (var el = node.parentNode; el && el !== root; el = el.parentNode) {
					if (el.style && el.style.display == "none")
						return NodeFilter.FILTER_REJECT;
					if (
						el.classList &&
						(el.classList.contains("fn") || el.classList.contains("chapter-hl"))
					)
						return NodeFilter.FILTER_REJECT;
				}
				return NodeFilter.FILTER_ACCEPT;
			},
		});
		var node;
		while ((node = walker.nextNode())) nodes.push(node);
		return nodes;
	}

	// applySettings rewrites God's name in place, so the chapter does not always
	// contain the word a search was run on: the BSB's text says "the LORD" and
	// the reader may be reading it as Yahweh, or the other way about. The span
	// keeps the text it stands for in data-name, so that is what is matched, and
	// the name on screen is marked whole - there is nothing to match inside it,
	// and half of it would be worse than none.
	function highlightRangesIn(node, terms, partial) {
		for (
			var el = node.parentNode;
			el && el.id != "chapterText";
			el = el.parentNode
		) {
			if (!el.dataset || !el.dataset.name) continue;
			var name = el.dataset.name.toLowerCase();
			var whole = terms.some(function (term) {
				return findTerm(name, term.toLowerCase(), partial, 0) >= 0;
			});
			return whole ? [[0, node.nodeValue.length]] : [];
		}
		return findTermRanges(node.nodeValue, terms, partial);
	}

	// Words are found the way the search page found them: as a phrase or each
	// word, and on whole words only when Partial is off. The two share these
	// rules so a result and the chapter it opens agree about what matched.
	var WORD_CHAR = /[A-Za-z0-9'’-]/;

	function isWordChar(ch) {
		return ch !== "" && WORD_CHAR.test(ch);
	}

	function isWholeWord(text, start, len) {
		return (
			!isWordChar(start > 0 ? text.charAt(start - 1) : "") &&
			!isWordChar(start + len < text.length ? text.charAt(start + len) : "")
		);
	}

	function findTerm(text, term, partial, from) {
		for (
			var i = text.indexOf(term, from);
			i >= 0;
			i = text.indexOf(term, i + 1)
		) {
			if (partial || isWholeWord(text, i, term.length)) return i;
		}
		return -1;
	}

	// Every match of any of the terms in one piece of text: earliest first, and
	// the longest where two start together, so "the heavens" wins over
	// "heavens". What one term takes, another cannot match inside.
	function findTermRanges(text, terms, partial) {
		var lower = text.toLowerCase();
		var ranges = [];
		var pos = 0;
		while (pos <= text.length) {
			var idx = -1;
			var len = 0;
			for (var i = 0; i < terms.length; i++) {
				var t = terms[i].toLowerCase();
				var j = findTerm(lower, t, partial, pos);
				if (
					j >= 0 &&
					(idx < 0 || j < idx || (j == idx && t.length > len))
				) {
					idx = j;
					len = t.length;
				}
			}
			if (idx < 0) break;
			ranges.push([idx, idx + len]);
			pos = idx + len;
		}
		return ranges;
	}

	// For the specs: the note a marker in the text would open, given the letter
	// it carries and the verse it stands in.
	window.testFootnote = function (letter, verse) {
		var found = findFootnote(verse || "", letter);
		if (!found) return null;
		return {
			letter: found.letter,
			verse: found.verse,
			text: found.nodes
				.map(function (node) {
					return node.textContent;
				})
				.join("")
				.trim(),
		};
	};

	window.testLookup = function (slug, chapter, verse, word) {
		return loadWordData(slug).then(function () {
			var entries = wordDataEntry(slug, chapter + ":" + verse);
			if (!entries) return null;
			var target = normWord(word);
			for (var i = 0; i < entries.length; i++) {
				var w = entries[i].w;
				var found = false;
				for (var j = 0; j < w.length; j++) {
					if (w[j] == target) found = true;
				}
				if (found) return entries[i];
			}
			return null;
		});
	};
</script>
