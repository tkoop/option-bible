<script>
	var currentBookIndex = 0;
	var currentChapter = 1; // one based
	var chronoSequence = [];
	var wordDataCache = {};

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function (event) {
			applySettings();
			applyWordStudyLinks();
			// The settings rewrite some words in place and swap which spelling
			// is on screen, so the marks are laid out again against the text as
			// it now reads.
			renderHighlights();
		},
	);

	function matchYou(original, you, your, yours) {
		var form = "?";

		// all lower case
		if (original == "you") return you;
		if (original == "your") return your;
		if (original == "yours") return yours;

		// first letter capital
		if (original == "You") return you[0].toUpperCase() + you.substr(1);
		if (original == "Your") return your[0].toUpperCase() + your.substr(1);
		if (original == "Yours") return yours[0].toUpperCase() + yours.substr(1);

		// all capital
		if (original == "YOU") return you.toUpperCase();
		if (original == "YOUR") return your.toUpperCase();
		if (original == "YOURS") return yours.toUpperCase();

		return original;
	}

	var chronoIconSvg =
	'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

	// The mark for a chapter being read through a plan. Drawn by plans.js and
	// guarded here, because the chapter component does not otherwise depend on
	// it being loaded.
	var chapterPlanIcon = typeof planIconSvg != "undefined" ? planIconSvg : "";

	function applySettings() {
		// Words of Christ (red letter)
		document.body.classList.toggle("woc-off", !settings.woc);

		// Chronological order indicator on chapter nav arrows
		document.body.classList.toggle(
			"chrono-nav",
			settings.order == "chronological",
		);

		// Titles
		if (settings.titles) {
			document
				.querySelectorAll(".hdg")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".hdg")
				.forEach((el) => (el.style.display = "none"));
		}

		// Verses
		if (settings.verses) {
			document
				.querySelectorAll(".reftext")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".reftext")
				.forEach((el) => (el.style.display = "none"));
		}

		// Cross references
		if (settings.references) {
			document
				.querySelectorAll(".cross1")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".cross1")
				.forEach((el) => (el.style.display = "none"));
		}

		// Footnotes. The class on the body is what makes a marker in the text
		// look tappable, which it is - it opens its note - but only while the
		// notes themselves are on screen.
		document.body.classList.toggle("fn-on", !!settings.footnotes);
		if (settings.footnotes) {
			document
				.querySelectorAll(".fn")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".fn")
				.forEach((el) => (el.style.display = "none"));
		}

		// Spelling
		document
			.querySelectorAll(".spell")
			.forEach((el) => (el.style.display = "none"));
		document
			.querySelectorAll(".spell." + settings.spelling)
			.forEach((el) => (el.style.display = "inline"));

		// Case
		if (settings.case == "lower") {
			document
				.querySelectorAll(".cap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".nocap")
				.forEach((el) => (el.style.display = "inline"));
			document
				.querySelectorAll(".bsb")
				.forEach((el) => (el.style.display = "none"));
		} else if (settings.case == "upper") {
			document
				.querySelectorAll(".cap")
				.forEach((el) => (el.style.display = "inline"));
			document
				.querySelectorAll(".nocap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".bsb")
				.forEach((el) => (el.style.display = "none"));
		} else {
			document
				.querySelectorAll(".cap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".nocap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".bsb")
				.forEach((el) => (el.style.display = "inline"));
		}

		// God's name
		if (settings.name == "LORD") {
			document
				.querySelectorAll(".lord")
				.forEach((el) => (el.innerHTML = el.dataset.name));
			document
				.querySelectorAll(".caplord")
				.forEach((el) => (el.innerHTML = el.dataset.name));
		} else {
			document
				.querySelectorAll(".lord")
				.forEach((el) => (el.innerHTML = settings.name));
			document
				.querySelectorAll(".caplord")
				.forEach((el) => (el.innerHTML = settings.name.toUpperCase()));
		}

		// You plural
		document.querySelectorAll(".youpl").forEach((el) => {
			if (settings.you == "you")
				el.innerHTML = matchYou(el.dataset.word, "you", "your", "yours");
			if (settings.you == "youall")
				el.innerHTML = matchYou(
					el.dataset.word,
					"you all",
					"you all's",
					"you alls's",
				);
			if (settings.you == "yall")
				el.innerHTML = matchYou(
					el.dataset.word,
					"y'all",
					"y'all's",
					"y'alls's",
				);
			if (settings.you == "youguys")
				el.innerHTML = matchYou(
					el.dataset.word,
					"you guys",
					"you guy's",
					"you guys's",
				);
			if (settings.you == "youpl")
				el.innerHTML =
					matchYou(el.dataset.word, "you", "your", "yours") + "<sup>(pl)</sup>";

			if (settings.you == "youcoloured")
				el.innerHTML =
					"<span style='color:#00a7f9'>" +
					matchYou(el.dataset.word, "you", "your", "yours") +
					"</span>";
		});

		// You singular
		document.querySelectorAll(".yousg").forEach((el) => {
			if (settings.you == "youpl")
				el.innerHTML =
					matchYou(el.dataset.word, "you", "your", "yours") + "<sup>(sg)</sup>";
			else
				el.innerHTML = matchYou(el.dataset.word, "you", "your", "yours");
		});

		if (document.querySelectorAll(".version")) {
			document
				.querySelectorAll(".version")
				.forEach((el) => (el.innerHTML = getVersion()));
			// The tag alone does not say where the settings behind it came from.
			document
				.querySelectorAll(".version-shared")
				.forEach(
					(el) =>
						(el.style.display = usingSharedSettings() ? "" : "none"),
				);
		}

		document.getElementById("body").style.fontSize =
			settings.fontSize * FONT_SCALE + "px";

		setupPageTurn();
	}

	applySettings();

	function loadChapter(element) {
		var book = element.dataset.book;
		var slug = element.dataset.slug;
		var chapter = element.dataset.chapter;
		loadThisChapter(book, slug, chapter);
	}

	function loadThisChapter(book, slug, chapter) {
		// Any other way into a chapter is the reader choosing one, which leaves
		// the reading plan they arrived through behind.
		if (typeof clearPlanReadingContext == "function")
			clearPlanReadingContext();
		window.__userNavigated = true;
		var url = chapterUrl(slug, chapter);
		var bookObj = books.find((b) => b.slug === slug);
		// The settings a shared link brought ride along in the address bar, so
		// the version on screen survives a reload or a bookmark.
		var hash = "#" + bookObj.abbr + "-" + chapter + sharedSettingsQuery();
		history.pushState(hash, "", hash);

		updatePage(hash);

		fireEvent({
			name: "addBrowseHistory",
			data: {
				name: book,
				slug: slug,
				chapter: chapter,
				date: todayDateString(),
				finished: false,
				activity: settings.activity,
			},
		});

		currentBookIndex = slugToIndex(slug);
		currentChapter = chapter;
		window.scrollTo(0, 0);
	}

	function moveChapter(delta) {
		// A chapter opened from a reading plan is followed through that day's
		// reading, which is three or four chapters in the order the plan chose -
		// not the order of the Bible, and not the reader's chronological setting.
		if (typeof followPlanChapter == "function" && followPlanChapter(delta))
			return;

		if (settings.order == "chronological" && chronoSequence.length > 0) {
			var pos = -1;
			for (var i = 0; i < chronoSequence.length; i++) {
				if (
					chronoSequence[i].slug == books[currentBookIndex].slug &&
					chronoSequence[i].chapter == currentChapter
				) {
					pos = i;
					break;
				}
			}
			if (pos == -1) {
				pos = 0;
			} else {
				pos = (pos + delta + chronoSequence.length) % chronoSequence.length;
			}
			var target = chronoSequence[pos];
			loadThisChapter(target.name, target.slug, target.chapter);
			return;
		}

		currentChapter = parseInt(currentChapter) + parseInt(delta);
		if (currentChapter < 1) {
			currentBookIndex--;
			if (currentBookIndex < 0) {
				// went left from Genesis
				currentBookIndex = books.length - 1;
			}
			currentChapter = books[currentBookIndex].chapters;
		}
		if (currentChapter > books[currentBookIndex].chapters) {
			currentBookIndex++;
			if (currentBookIndex >= books.length) {
				// went right from Revelation
				currentBookIndex = 0;
			}
			currentChapter = 1;
		}

		loadThisChapter(
			books[currentBookIndex].name,
			books[currentBookIndex].slug,
			currentChapter,
		);
	}

	function titleCase(str) {
		return str
			.toLowerCase()
			.split(" ")
			.map(function (word) {
				return word.replace(word[0], word[0].toUpperCase());
			})
			.join(" ");
	}

	function totalChapterCount() {
		var total = 0;
		for (var i = 0; i < books.length; i++) total += books[i].chapters;
		return total;
	}

	// Day 0 = March 13, 2025 = Genesis 1. One chapter per day, wrapping.
	function todaysChapterIndex(date) {
		var d = date ? new Date(date) : new Date();
		d.setHours(0, 0, 0, 0);
		var anchor = new Date(2025, 2, 13);
		anchor.setHours(0, 0, 0, 0);
		var days = Math.round((d - anchor) / 86400000);
		var total = totalChapterCount();
		return ((days % total) + total) % total;
	}

	function chapterIndexToBookAndChapter(idx) {
		var total = totalChapterCount();
		if (idx >= total || idx < 0) idx = 0;
		for (var i = 0; i < books.length; i++) {
			if (idx < books[i].chapters) {
				return { book: books[i], chapter: idx + 1 };
			}
			idx -= books[i].chapters;
		}
		var last = books[books.length - 1];
		return { book: last, chapter: last.chapters };
	}

	function goToTodaysChapter() {
		// Reading the chapter of the day is always a COTD activity, and it
		// becomes the current one so the chapters read after it are too.
		fireEvent({ name: "setSetting", setting: "activity", value: "cotd" });
		var target = chapterIndexToBookAndChapter(todaysChapterIndex());
		loadThisChapter(target.book.name, target.book.slug, target.chapter);
	}

	function slugToIndex(slug) {
		for (var i = 0; i < books.length; i++) {
			if (books[i].slug == slug) {
				return i;
			}
		}
		return 0;
	}

	function loadURL(url, skipHistory) {
		var chapter = document.getElementById("chapter");
		chapter.innerHTML = "";

		// The footnotes belong to the chapter that has just been cleared, so the
		// notes read out of the last one go with it.
		footnoteEntries = null;

		// Whoever asked for these words asked before the fetch started, and only
		// one chapter is ever in flight, so they are taken here: a chapter that
		// arrives without them - the next one, or one reached from the address
		// bar - is unmarked.
		var pendingHighlight = window.pendingHighlight;
		window.pendingHighlight = null;

		fetch(url)
			.then(function (response) {
				return response.text();
			})
			.then(function (text) {
				var fileName = url.split("/").pop();
				var withoutExt = fileName.slice(0, -5);
				var parts = withoutExt.split("-");
				var chapterNum = parts.pop();
				var slug = parts.join("-");
				var book = books.find((b) => b.slug === slug);
				// Keep the arrow buttons anchored to the chapter on screen. This
				// is the only path all chapter loads funnel through, including
				// the initial hash and back/forward navigation.
				currentBookIndex = slugToIndex(slug);
				currentChapter = parseInt(chapterNum) || 1;
			var title = book
				? chapterRefName(book.name) + " " + chapterNum
				: titleCase(slug.replaceAll("-", " "));
				title = title.replace(" Of ", " of "); // Song of Solomon
				// The marker sits outside the brackets: the tag is a version string, and the
		// word beside it is a note about where the settings behind it came from.
		title =
			title +
			" (<span class='version'></span>)<span class='version-shared' title='These settings came from a shared link' style='display: none'> shared</span>";
				chapter.innerHTML = addArrows(text, title);
				// A chapter reached through a plan says which plan and which day
				// of it, and marks each arrow with an open book only when there is
				// a step in that direction - so the icon does not promise a move
				// the plan cannot make. The mark is set per chapter rather than
				// by the settings, since the reading under way changes with every
				// one of them.
				var planNote =
					typeof planReadingNote == "function" ? planReadingNote() : null;
				var chapterText = document.getElementById("chapterText");
				if (planNote && chapterText)
					chapterText.parentNode.insertBefore(planNote, chapterText);
				if (typeof planHasStep == "function") {
					var hasPrev = planHasStep(-1);
					var hasNext = planHasStep(1);
					document
						.querySelectorAll("[data-cy='chapterLeft']")
						.forEach(function (button) {
							button.classList.toggle("plan-step-left", hasPrev);
						});
					document
						.querySelectorAll("[data-cy='chapterRight']")
						.forEach(function (button) {
							button.classList.toggle("plan-step-right", hasNext);
						});
				}
				applySettings();
				applyWordStudyLinks(book ? book.slug : null, chapterNum);
				applyChapterHighlight(pendingHighlight);
				setTimeout(chapterFinishedCheck, 100);

fireEvent({
				name: "showPage",
				page: "chapter",
				hash: book ? book.abbr + "-" + chapterNum + sharedSettingsQuery() : "",
				skipHistory: !!skipHistory,
			});

			// The page element is only laid out once the showPage event above has
			// made it visible, so measure the page dimensions now.
			if (pageTurning.enabled) {
				recalcPages();
			}

			// If we arrived here from a search result, scroll to that verse.
			if (window.scrollVerse) {
				var verseNum = window.scrollVerse;
				window.scrollVerse = null;
				if (pageTurning.enabled) {
					var pendingVerse = verseNum;
					setTimeout(function () {
						jumpToPageWithVerse(pendingVerse);
					}, 0);
				} else {
					var verseEl = document.getElementById("v" + verseNum);
					var scrollTarget = (verseEl && verseEl.closest("p")) || verseEl;
					if (scrollTarget) {
						setTimeout(function () {
							scrollTarget.scrollIntoView({ block: "center" });
						}, 0);
					}
				}
			}

			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(function () {
					if (pageTurning.enabled) recalcPages();
				});
			}
			});
	}

	function getVersion() {
		var letter = settings.spelling.substr(0, 1).toUpperCase();
		if (letter == "G") letter = "B";

		var nameLetter = settings.name[0];
		if (settings.name == "G-d") nameLetter = "D";
		if (settings.name == "YHWH") nameLetter = "W";
		if (settings.name == "YHVH") nameLetter = "V";

		var upperLower = settings.case[0].toUpperCase();

		return "O-" + letter + nameLetter + upperLower + youLetter() + styleLetter();
	}

	// Plural You is the last tag letter because it is the last setting the
	// menu offers that rewrites the words: Y = "you", P = (pl)/(sg) marks,
	// A = "you all", V = "y'all", G = "you guys", C = coloured (blue) "you".
	function youLetter() {
		switch (settings.you) {
			case "youall":
				return "A";
			case "yall":
				return "V";
			case "youguys":
				return "G";
			case "youcoloured":
				return "C";
			case "youpl":
				return "P";
			default:
				return "Y";
		}
	}

	function styleLetter() {
		switch (settings.style) {
			case "college-professor":
				return "P";
			case "grade-4":
				return "4";
			case "grade-8":
				return "8";
			case "grade-12":
				return "T";
			default:
				return "B";
		}
	}

	function addArrows(html, title) {
		var arrows = `<div class="chapter-nav">
			<button data-cy="chapterLeft" onclick="moveChapter(-1)" aria-label="Previous chapter">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M15.41 16.58L10.83 12L15.41 7.41L14 6L8 12L14 18L15.41 16.58Z" fill="currentColor"/>
				</svg>
<span class="chrono-corner">${chronoIconSvg}</span>
<span class="plan-corner">${chapterPlanIcon}</span>
			</button>
			<div id="chapterTitle"><span class="title-rule"></span><span class="title-text">${title}</span><span class="title-rule"></span></div>
			<button data-cy="chapterRight" onclick="moveChapter(1)" aria-label="Next chapter">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.59 16.58L13.17 12L8.59 7.41L10 6L16 12L10 18L8.59 16.58Z" fill="currentColor"/>
				</svg>
				<span class="chrono-corner">${chronoIconSvg}</span>
<span class="plan-corner">${chapterPlanIcon}</span>
			</button>
		</div>`;

		return (
			arrows +
			"<div id='chapterText'>" +
			html +
			"</div><div id='chapterSpacer' style='height:32px'></div>" +
			arrows.replace("chapter-nav", "chapter-nav bottom") +
			// The way back to unmarked text. It is fixed to the viewport rather
			// than to the chapter, because in page turning mode the chapter does
			// not scroll at all, and it sits outside #chapterText so the page
			// turn's transform does not carry it away with the columns.
			"<div id='highlightNav' style='display: none; position: fixed; right: 14px; bottom: 70px; z-index: 60; gap: 8px; align-items: center;'>" +
			"<button id='backToSearchResults' data-cy='backToSearchResults' class='search-match-position' type='button' onclick='goBackToSearchResults()'></button>" +
			"<button id='prevSearchResult' data-cy='prevSearchResult' type='button' onclick='goPrevSearchResult()'>Prev</button>" +
			"<button id='clearHighlights' data-cy='clearHighlights' type='button' onclick='clearChapterHighlight()'>Clear</button>" +
			"<button id='nextSearchResult' data-cy='nextSearchResult' type='button' onclick='goNextSearchResult()'>Next</button>" +
			"</div>"
		);
	}

	var pageTurning = {
		enabled: false,
		page: 0, // zero based
		pageCount: 1,
		pageGap: 8,
		swipeDistance: 40, // px of horizontal travel before it counts as a swipe
	};

	var pageTurnArrows = {
		left:
			'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.41 16.58L10.83 12L15.41 7.41L14 6L8 12L14 18L15.41 16.58Z" fill="currentColor"/></svg>',
		right:
			'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.59 16.58L13.17 12L8.59 7.41L10 6L16 12L10 18L8.59 16.58Z" fill="currentColor"/></svg>',
	};

	function isChapterLoaded() {
		var chapter = document.getElementById("chapter");
		return chapter && !!chapter.querySelector("#chapterText");
	}

	function setupPageTurn() {
		if (!isChapterLoaded()) return;
		if (settings.pageturning) {
			enablePageTurn();
		} else {
			disablePageTurn();
		}
	}

	function enablePageTurn() {
		var chapter = document.getElementById("chapter");
		var textWrap = document.getElementById("chapterText");
		var spacer = document.getElementById("chapterSpacer");
		if (!chapter || !textWrap || !spacer) return;

		// The .page-turn class lives on #chapter and survives innerHTML resets,
		// so only treat the mode as already set up if the existing viewport is
		// connected to the current chapter content.
		var viewport = document.getElementById("pageTurnViewport");
		if (viewport && viewport.contains(textWrap)) {
			recalcPages();
			return;
		}

		var viewport = document.createElement("div");
		viewport.id = "pageTurnViewport";
		viewport.className = "page-turn-viewport";

		var controls = document.createElement("div");
		controls.id = "pageTurnControls";
		controls.className = "page-turn-controls";
		controls.innerHTML =
			'<button id="pageTurnLeft" class="page-turn-btn" aria-label="Previous page" onclick="turnPage(-1)">' +
			pageTurnArrows.left +
			"</button>" +
			'<div id="pageTurnDots" class="page-turn-dots"></div>' +
			'<div id="pageTurnCount" class="page-turn-count" aria-live="polite"></div>' +
			'<button id="pageTurnRight" class="page-turn-btn" aria-label="Next page" onclick="turnPage(1)">' +
			pageTurnArrows.right +
			"</button>";

		chapter.classList.add("page-turn");
		chapter.style.display = "flex";
		viewport.appendChild(textWrap);
		chapter.insertBefore(viewport, spacer);
		chapter.appendChild(controls);

		pageTurning.enabled = true;
		pageTurning.page = 0;
		attachSwipeGestures(viewport);
		recalcPages();
	}

	// Swipe left/right over the text to page through the chapter. Pointer events
	// cover touch, pen and mouse drags; a drag that selected text is left alone
	// so text selection still works, and vertical drags never page.
	function attachSwipeGestures(viewport) {
		var startX = 0;
		var startY = 0;
		var tracking = false;

		viewport.addEventListener("pointerdown", function (event) {
			// a second finger means a pinch, not a swipe
			if (event.isPrimary === false) {
				tracking = false;
				return;
			}
			if (event.pointerType === "mouse" && event.button !== 0) return;
			// let taps on links and buttons through
			if (event.target.closest && event.target.closest("a, button")) return;
			tracking = true;
			startX = event.clientX;
			startY = event.clientY;
			if (event.pointerType !== "mouse" && viewport.setPointerCapture) {
				try {
					viewport.setPointerCapture(event.pointerId);
				} catch (e) {
					// capture is best effort; the swipe still works without it
				}
			}
		});

		viewport.addEventListener("pointerup", function (event) {
			if (!tracking) return;
			tracking = false;
			var dx = event.clientX - startX;
			var dy = event.clientY - startY;
			if (Math.abs(dx) < pageTurning.swipeDistance) return;
			if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // mostly vertical
			// a drag that left text selected was a selection, not a page turn.
			// Compare isCollapsed rather than the selection text: text selected
			// inside the column layout does not stringify.
			var selection = window.getSelection ? window.getSelection() : null;
			if (event.pointerType === "mouse" && selection && !selection.isCollapsed) {
				return;
			}
			// swiping left moves forward through the chapter
			turnPage(dx < 0 ? 1 : -1);
		});

		viewport.addEventListener("pointercancel", function () {
			tracking = false;
		});
	}

	function disablePageTurn() {
		var chapter = document.getElementById("chapter");
		if (!chapter) return;
		var viewport = document.getElementById("pageTurnViewport");
		var controls = document.getElementById("pageTurnControls");
		var textWrap = document.getElementById("chapterText");
		var spacer = document.getElementById("chapterSpacer");

		chapter.classList.remove("page-turn");
		chapter.style.display = "block";
		if (viewport && textWrap && spacer) {
			chapter.insertBefore(textWrap, spacer);
			viewport.remove();
		}
		if (controls) controls.remove();
		if (textWrap) textWrap.removeAttribute("style");
		pageTurning.enabled = false;
	}

	function recalcPages() {
		if (!pageTurning.enabled) return;
		var viewport = document.getElementById("pageTurnViewport");
		var textWrap = document.getElementById("chapterText");
		if (!viewport || !textWrap) return;

		var width = viewport.clientWidth;
		var height = viewport.clientHeight;
		if (!width || !height) return;

		var gap = pageTurning.pageGap;
		var step = width + gap;

		viewport.classList.add("no-anim");
		textWrap.style.height = height + "px";
		textWrap.style.columnWidth = width + "px";
		textWrap.style.columnGap = gap + "px";
		textWrap.style.columnFill = "auto";
		textWrap.style.webkitColumnFill = "auto";
		textWrap.style.transform = "";

		var scrollWidth = textWrap.scrollWidth;
		if (scrollWidth < width) scrollWidth = width;
		var pageCount = Math.max(1, Math.round((scrollWidth - width) / step) + 1);
		pageTurning.pageCount = pageCount;
		if (pageTurning.page > pageCount - 1) pageTurning.page = pageCount - 1;
		if (pageTurning.page < 0) pageTurning.page = 0;

		applyPageTransform(false);
		renderPageTurnIndicator();

		var viewportEl = viewport;
		requestAnimationFrame(function () {
			viewportEl.classList.remove("no-anim");
		});
	}

	function applyPageTransform(animate) {
		if (!pageTurning.enabled) return;
		var viewport = document.getElementById("pageTurnViewport");
		var textWrap = document.getElementById("chapterText");
		if (!viewport || !textWrap) return;
		var step = viewport.clientWidth + pageTurning.pageGap;
		viewport.classList.toggle("no-anim", !animate);
		textWrap.style.transform =
			"translateX(" + -pageTurning.page * step + "px)";
	}

	function renderPageTurnIndicator() {
		var dots = document.getElementById("pageTurnDots");
		var count = document.getElementById("pageTurnCount");
		if (!dots) return;
		var leftBtn = document.getElementById("pageTurnLeft");
		var rightBtn = document.getElementById("pageTurnRight");
		dots.innerHTML = "";
		var total = pageTurning.pageCount;
		var frag = document.createDocumentFragment();
		for (var i = 0; i < total; i++) {
			var dot = document.createElement("button");
			dot.type = "button";
			dot.className =
				"page-turn-dot" + (i === pageTurning.page ? " active" : "");
			dot.setAttribute("aria-label", "Go to page " + (i + 1));
			if (i === pageTurning.page)
				dot.setAttribute("aria-current", "true");
			dot.setAttribute("data-page", i);
			dot.onclick = (function (n) {
				return function () {
					goToPage(n, true);
				};
			})(i);
			frag.appendChild(dot);
		}
		dots.appendChild(frag);
		if (count) {
			count.textContent =
				pageTurning.page + 1 + " / " + pageTurning.pageCount;
		}
		if (leftBtn) leftBtn.disabled = pageTurning.page === 0;
		if (rightBtn) rightBtn.disabled = pageTurning.page >= total - 1;
	}

	function goToPage(n, allowFinish) {
		if (!pageTurning.enabled) return;
		n = Math.max(0, Math.min(n, pageTurning.pageCount - 1));
		if (n === pageTurning.page) return;
		pageTurning.page = n;
		applyPageTransform(true);
		renderPageTurnIndicator();
		// only explicit paging (not a search jump) counts as reading to the end
		if (allowFinish && n === pageTurning.pageCount - 1) {
			markCurrentChapterFinished();
		}
	}

	function turnPage(delta) {
		if (!pageTurning.enabled) return;
		goToPage(pageTurning.page + delta, true);
	}

	function jumpToPageWithVerse(verseNum) {
		if (!pageTurning.enabled) return;
		var el = document.getElementById("v" + verseNum);
		var textWrap = document.getElementById("chapterText");
		var viewport = document.getElementById("pageTurnViewport");
		if (!el || !textWrap || !viewport) return;
		// The verse number is a setting, and when it is off the marker is hidden -
		// a hidden box has no position - so the paragraph it opens is measured
		// instead, the same one the scrolling route centres.
		var target = el.closest("p") || el;
		var step = viewport.clientWidth + pageTurning.pageGap;
		var relLeft =
			target.getBoundingClientRect().left - textWrap.getBoundingClientRect().left;
		var page = Math.max(0, Math.floor(relLeft / step));
		goToPage(page);
	}

	window.addEventListener("resize", function () {
		if (pageTurning.enabled) recalcPages();
	});

	if (window.visualViewport) {
		window.visualViewport.addEventListener("resize", function () {
			if (pageTurning.enabled) recalcPages();
		});
	}

	window.addEventListener("keydown", function (event) {
		if (!pageTurning.enabled) return;
		var tag = (document.activeElement && document.activeElement.tagName) || "";
		if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
		if (event.key === "ArrowRight" || event.key === "PageDown") {
			event.preventDefault();
			goToPage(pageTurning.page + 1, true);
		} else if (event.key === "ArrowLeft" || event.key === "PageUp") {
			event.preventDefault();
			goToPage(pageTurning.page - 1, true);
		}
	});

	function createLink(name, slug, chapter, includeBook) {
		if (includeBook) {
			return `<a href='#' style='white-space:nowrap' data-slug='${slug}' data-book='${name}' data-chapter='${chapter}' onclick='loadChapter(this); return false'>${chapterRefName(name)} ${chapter}</a>`;
		} else {
			return `<a href='#' data-slug='${slug}' data-book='${name}' data-chapter='${chapter}' onclick='loadChapter(this); return false'>${chapter}</a>`;
		}
	}

	function toggleBookChapters(bookEl) {
		var chapters = bookEl.nextElementSibling;
		var isOpen = chapters.style.display == "flex";
		if (isOpen) {
			chapters.style.display = "none";
			bookEl.classList.toggle("open", !isOpen);
			return;
		}
		document.querySelectorAll(".index-chapters").forEach((el) => {
			el.style.display = "none";
		});
		document.querySelectorAll(".index-book.open").forEach((el) => {
			el.classList.remove("open");
		});
		chapters.style.display = "flex";
		bookEl.classList.add("open");
	}

	function makeTestamentSection(title) {
		var section = document.createElement("div");
		section.className = "index-section";
		section.innerHTML =
			"<div class='index-section-title'>" +
			title +
			"</div><div class='index-books'></div>";
		return section;
	}

	var order = settings.order;

	var indexContainers = [];

	function applyOrderToUI(container) {
		if (!container) return;
		container
			.querySelectorAll(".index-order-button")
			.forEach((b) => b.classList.toggle("active", b.id == "order-" + order));
		container.querySelectorAll(".index-sections").forEach((s) => {
			var show =
				(order == "canonical" && s.classList.contains("index-canonical")) ||
				(order == "chronological" &&
					s.classList.contains("index-chronological")) ||
				(order == "alphabetical" && s.classList.contains("index-alphabetical"));
			s.style.display = show ? "flex" : "none";
		});
	}

	function applyOrderToAllContainers() {
		indexContainers.forEach(applyOrderToUI);
	}

	function setBibleOrder(newOrder) {
		order = newOrder;
		if (newOrder == "canonical" || newOrder == "chronological") {
			if (settings.order != newOrder) {
				fireEvent({
					name: "setSetting",
					setting: "order",
					value: newOrder,
				});
			}
		}
		applyOrderToAllContainers();
	}

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function (event) {
			if (order != "alphabetical" && settings.order != order) {
				order = settings.order;
				applyOrderToAllContainers();
			}
			// A new Style means a new translation: reload the chapter in it.
			if (window.__lastStyle !== undefined && settings.style !== window.__lastStyle) {
				window.__lastStyle = settings.style;
				var book = currentBook();
				var chapter = currentBookChapter();
				if (book && chapter) {
					loadURL(chapterUrl(book.slug, chapter), true);
				}
			} else {
				window.__lastStyle = settings.style;
			}
		}
	);

	function makeOrderPicker() {
		var picker = document.createElement("div");
		picker.className = "index-order";

		function orderButton(label, order) {
			var button = document.createElement("button");
			button.type = "button";
			button.className = "index-order-button";
			button.id = "order-" + order;
			button.textContent = label;
			button.onclick = function () {
				setBibleOrder(order);
			};
			return button;
		}

		picker.appendChild(orderButton("Canonical", "canonical"));
		var chronoButton = orderButton("Chronological", "chronological");
		chronoButton.innerHTML = "Chronological " + chronoIconSvg;
		picker.appendChild(chronoButton);
		picker.appendChild(orderButton("Alphabetical", "alphabetical"));
		return picker;
	}

	function buildCanonicalSections(container, cyPrefix) {
		var section = document.createElement("div");
		section.className = "index-sections index-canonical";
		if (!cyPrefix) section.id = "canonicalSections";

		var oldTestament = makeTestamentSection("The Old Testament");
		var newTestament = makeTestamentSection("The New Testament");
		var oldBooks = oldTestament.querySelector(".index-books");
		var newBooks = newTestament.querySelector(".index-books");

		books.forEach(function (book, idx) {
			var bookDiv = document.createElement("div");
			bookDiv.className = "index-book-row";
			bookDiv.innerHTML =
				"<div class='index-book' data-book='" +
				book.name +
				"' onclick='toggleBookChapters(this)'>" +
				book.name +
				"</div>";
			var chapterLinks =
				"<div class='index-chapters' data-cy='" +
				cyPrefix +
				book.name +
				"' style='display:none'>";
			for (let i = 1; i <= book.chapters; i++) {
				chapterLinks += createLink(book.name, book.slug, i) + " ";
			}
			chapterLinks += "</div>";
			bookDiv.innerHTML += chapterLinks;
			(idx < 39 ? oldBooks : newBooks).appendChild(bookDiv);
		});

		section.appendChild(oldTestament);
		section.appendChild(newTestament);
		container.appendChild(section);
	}

	function buildChronoSections(container, cyPrefix) {
		var section = document.createElement("div");
		section.className = "index-sections index-chronological";
		if (!cyPrefix) section.id = "chronoSections";
		container.appendChild(section);
		container._chronoWrap = section;
		container._cyPrefix = cyPrefix;
	}

	function otEraIndex(entry) {
		var name = entry.book;
		var first = entry.chapter[0];
		switch (name) {
			case "Genesis":
				return first == 1 ? 0 : 1;
			case "Job":
				return 1;
			case "Exodus":
			case "Leviticus":
			case "Numbers":
			case "Deuteronomy":
				return 2;
			case "Psalm":
			case "Psalms":
				if (first == 90) return 2;
				if (entry.chapter.indexOf(74) != -1) return 6;
				return 4;
			case "Joshua":
			case "Judges":
			case "Ruth":
				return 3;
			case "1 Samuel":
			case "2 Samuel":
			case "1 Chronicles":
				return 4;
			case "2 Chronicles":
				return first <= 9 ? 4 : 5;
			case "1 Kings":
				return first <= 11 ? 4 : 5;
			case "2 Kings":
				return first <= 23 ? 5 : 6;
			case "Proverbs":
			case "Ecclesiastes":
			case "Song of Solomon":
				return 4;
			case "Obadiah":
			case "Joel":
			case "Amos":
			case "Jonah":
			case "Hosea":
			case "Isaiah":
			case "Micah":
			case "Nahum":
			case "Zephaniah":
			case "Habakkuk":
				return 5;
			case "Jeremiah":
				return first <= 47 ? 5 : 6;
			case "Ezekiel":
			case "Daniel":
			case "Lamentations":
				return 6;
			case "Ezra":
			case "Haggai":
			case "Zechariah":
			case "Esther":
			case "Nehemiah":
			case "Malachi":
				return 7;
			default:
				return 0;
		}
	}

	function chronicleSectionIndex(book, entry) {
		var idx = books.indexOf(book);
		if (idx < 39) {
			var otGroup = [0, 0, 0, 1, 2, 3, 3, 3];
			return otGroup[otEraIndex(entry)];
		}
		if (idx <= 42) return 4;
		return 5;
	}

	function chronoBook(name) {
		var canonicalName = name == "Psalm" ? "Psalms" : name;
		return books.find((b) => b.name == canonicalName);
	}

	function formatChapterList(chapters) {
		chapters.sort((a, b) => a - b);
		if (chapters.length == 1) return "" + chapters[0];
		var groups = [];
		var start = chapters[0];
		var end = chapters[0];
		for (var i = 1; i < chapters.length; i++) {
			if (chapters[i] == end + 1) {
				end = chapters[i];
			} else {
				groups.push(start == end ? start : start + "-" + end);
				start = chapters[i];
				end = chapters[i];
			}
		}
		groups.push(start == end ? start : start + "-" + end);
		return groups.join(", ");
	}

	var chronoEntries = null;
	var chronoSequenceBuilt = false;

	function fillChronoSections(container, entries) {
		var wrap = container._chronoWrap;
		if (!wrap || wrap.childNodes.length > 0) return;
		var cyPrefix = container._cyPrefix || "";
		var eraTitles = [
			"From Creation to the Law",
			"The Conquest and the Judges",
			"The United Kingdom",
			"From the Divided Kingdom to the Restoration",
			"The Life of Christ",
			"The Early Church",
		];
		var sectionsMap = eraTitles.map(makeTestamentSection);
		var eraBooks = sectionsMap.map(function (section) {
			return section.querySelector(".index-books");
		});
		entries.forEach(function (entry, idx) {
			var book = chronoBook(entry.book);
			if (!book) {
				console.warn("ChronoChapters: unknown book " + entry.book);
				return;
			}
		var label =
			book.name == "Psalms" && entry.chapter.length >= 100
				? "Psalms (most)"
				: (entry.chapter.length == 1
						? chapterRefName(book.name)
						: book.name) +
					" " +
					formatChapterList(entry.chapter);
			var row = document.createElement("div");
			row.className = "index-book-row";
			row.innerHTML =
				"<div class='index-book' data-book='" +
				book.name +
				"' data-cy='" +
				cyPrefix +
				"chrono-" +
				idx +
				"' onclick='toggleBookChapters(this)'>" +
				label +
				"</div>";
			var chapterLinks =
				"<div class='index-chapters' data-cy='" +
				cyPrefix +
				"chronoChapters-" +
				idx +
				"' style='display:none'>";
			entry.chapter.forEach(function (chapter) {
				chapterLinks += createLink(book.name, book.slug, chapter) + " ";
			});
			chapterLinks += "</div>";
			row.innerHTML += chapterLinks;
			eraBooks[chronicleSectionIndex(book, entry)].appendChild(row);
		});
		sectionsMap.forEach(function (section) {
			wrap.appendChild(section);
		});
	}

	function buildChronoSequence(entries) {
		if (chronoSequenceBuilt) return;
		entries.forEach(function (entry) {
			var book = chronoBook(entry.book);
			if (!book) return;
			entry.chapter.forEach(function (chapter) {
				chronoSequence.push({
					name: book.name,
					slug: book.slug,
					chapter: chapter,
				});
			});
		});
		chronoSequenceBuilt = true;
	}

	function buildAlphabeticalSections(container, cyPrefix) {
		var section = document.createElement("div");
		section.className = "index-sections index-alphabetical";
		if (!cyPrefix) section.id = "alphabeticalSections";
		var sortedBooks = books.slice().sort(function (a, b) {
			return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
		});
		sortedBooks.forEach(function (book) {
			var bookDiv = document.createElement("div");
			bookDiv.className = "index-book-row";
			bookDiv.innerHTML =
				"<div class='index-book' data-book='" +
				book.name +
				"' data-cy='" +
				cyPrefix +
				"alpha-" +
				book.name +
				"' onclick='toggleBookChapters(this)'>" +
				book.name +
				"</div>";
			var chapterLinks =
				"<div class='index-chapters' data-cy='" +
				cyPrefix +
				"alphaChapters-" +
				book.name +
				"' style='display:none'>";
			for (let i = 1; i <= book.chapters; i++) {
				chapterLinks += createLink(book.name, book.slug, i) + " ";
			}
			chapterLinks += "</div>";
			bookDiv.innerHTML += chapterLinks;
			section.appendChild(bookDiv);
		});
		container.appendChild(section);
	}

	// ---------- Reference jump ----------
	//
	// Both lists of chapters to go to - the index page and the home page's
	// chapter picker - open with a field to type a reference into, so the books
	// below are the second way in rather than the only one. books.js works out
	// what has been typed; this is the field, the answers under it, and the
	// journey from one to the chapter.

	function buildRefJump(container, cyPrefix) {
		var wrap = document.createElement("div");
		wrap.className = "ref-jump";

		var input = document.createElement("input");
		input.className = "ref-jump-input";
		input.type = "search";
		input.placeholder = "Go to a reference, like John 3:16";
		input.autocomplete = "off";
		input.spellcheck = false;
		input.setAttribute("data-cy", cyPrefix + "refJumpInput");
		input.setAttribute("aria-label", "Go to a reference");
		input.setAttribute("aria-expanded", "false");
		input.setAttribute("role", "combobox");
		input.setAttribute("aria-autocomplete", "list");

		var list = document.createElement("div");
		list.className = "ref-jump-list";
		list.setAttribute("data-cy", cyPrefix + "refJumpList");
		list.setAttribute("role", "listbox");
		list.style.display = "none";

		wrap.appendChild(input);
		wrap.appendChild(list);
		container.appendChild(wrap);

		var options = [];
		var selected = -1;

		function closeRefList() {
			list.style.display = "none";
			list.innerHTML = "";
			options = [];
			selected = -1;
			input.setAttribute("aria-expanded", "false");
		}

		// The first answer is offered ready to take, which is what Enter picks,
		// so the arrow keys move from it rather than onto it.
		function selectRefOption(index) {
			if (!list.children.length) return;
			selected = (index + list.children.length) % list.children.length;
			for (var i = 0; i < list.children.length; i++) {
				var on = i === selected;
				list.children[i].classList.toggle("selected", on);
				list.children[i].setAttribute("aria-selected", on ? "true" : "false");
			}
		}

		function showRefList() {
			var suggestions = refSuggestions(input.value, 8);
			list.innerHTML = "";
			options = suggestions;
			if (!suggestions.length) {
				closeRefList();
				return;
			}
			suggestions.forEach(function (ref) {
				var option = document.createElement("button");
				option.type = "button";
				option.className = "ref-jump-option";
				option.textContent = ref.label;
				option.setAttribute("data-cy", cyPrefix + "refJumpOption");
				option.setAttribute("role", "option");
				// The tap has to land on the answer rather than on the blur that
				// closes the list under it.
				option.addEventListener("mousedown", function (event) {
					event.preventDefault();
				});
				option.addEventListener("click", function () {
					pickRef(ref);
				});
				list.appendChild(option);
			});
			list.style.display = "block";
			input.setAttribute("aria-expanded", "true");
			selectRefOption(0);
		}

		function pickRef(ref) {
			closeRefList();
			input.value = "";
			goToRef(ref);
		}

		input.addEventListener("input", showRefList);
		input.addEventListener("blur", closeRefList);
		input.addEventListener("keydown", function (event) {
			if (event.key === "Enter") {
				var ref = options[selected < 0 ? 0 : selected];
				if (!ref) return;
				event.preventDefault();
				pickRef(ref);
			} else if (event.key === "ArrowDown") {
				if (!options.length) return;
				event.preventDefault();
				selectRefOption(selected < 0 ? 0 : selected + 1);
			} else if (event.key === "ArrowUp") {
				if (!options.length) return;
				event.preventDefault();
				selectRefOption(selected <= 0 ? options.length - 1 : selected - 1);
			} else if (event.key === "Escape") {
				closeRefList();
			}
		});
	}

	// A verse in the reference asks the chapter for two things, and both are
	// contracts it already keeps with the rest of the app: window.scrollVerse
	// carries the verse to scroll to, and page turning mode works out which page
	// that is on, while window.pendingHighlight asks for the verse to be marked
	// where it lies.
	function goToRef(ref) {
		if (ref.verse) {
			window.scrollVerse = ref.verse;
			window.pendingHighlight = { verse: ref.verse, label: ref.label };
		}
		loadThisChapter(ref.book.name, ref.book.slug, ref.chapter);
	}

	function buildIndex(container, cyPrefix) {
		if (!container._indexBuilt) {
			container.innerHTML = "";
			buildRefJump(container, cyPrefix);
			if (!cyPrefix) {
				var activityHolder = document.createElement("div");
				activityHolder.className = "activity-picker-holder activity-quiet";
				container.appendChild(activityHolder);
				mountActivityPicker(activityHolder);
			}
			container.appendChild(makeOrderPicker());
			buildCanonicalSections(container, cyPrefix);
			buildChronoSections(container, cyPrefix);
			buildAlphabeticalSections(container, cyPrefix);
			if (chronoEntries) fillChronoSections(container, chronoEntries);
			if (indexContainers.indexOf(container) == -1)
				indexContainers.push(container);
			container._indexBuilt = true;
		}
		applyOrderToUI(container);
	}

	buildIndex(document.getElementById("index"), "");

	fetch("chronoChapters.json?version=2")
		.then(function (response) {
			return response.json();
		})
		.then(function (entries) {
			chronoEntries = entries;
			buildChronoSequence(entries);
			indexContainers.forEach(function (container) {
				fillChronoSections(container, entries);
			});
			applyOrderToAllContainers();
		});

	function markCurrentChapterFinished() {
		var bookObj = books[currentBookIndex];
		if (!bookObj) return;
		for (var i = settings.browseHistory.length - 1; i >= 0; i--) {
			var entry = settings.browseHistory[i];
			if (
				entry.slug == bookObj.slug &&
				parseInt(entry.chapter) == parseInt(currentChapter)
			) {
				if (!entry.finished) {
					entry.finished = true;
					saveSettingsToLocalStorage();
				}
				return;
			}
		}
	}

	function chapterFinishedCheck() {
		var chapterEl = document.getElementById("chapter");
		if (!chapterEl || getComputedStyle(chapterEl).display == "none") return;
		// only once the chapter has fully rendered (footer nav present)
		if (!chapterEl.querySelector(".chapter-nav.bottom")) return;
		// In page-turn mode the body does not scroll, so completion means the
		// reader reached the last page rather than the page bottom.
		if (pageTurning.enabled) {
			if (pageTurning.page >= pageTurning.pageCount - 1) {
				markCurrentChapterFinished();
			}
			return;
		}
		if (
			window.innerHeight + window.scrollY >=
			document.documentElement.scrollHeight - 80
		) {
			markCurrentChapterFinished();
		}
	}

	window.addEventListener("scroll", chapterFinishedCheck, { passive: true });
	window.addEventListener("resize", chapterFinishedCheck, { passive: true });

	// ---------- Word lookup ----------

	function normWord(w) {
		return w.toLowerCase().replace(/^'+|'+$/g, "");
	}

	function wordDataEntry(slug, verseKey) {
		var data = wordDataCache[slug];
		if (!data || !data.verses) return null;
		return data.verses[verseKey] || null;
	}

	function currentBook() {
		var hash = location.hash || "";
		var m = /^#([A-Za-z0-9]+)-(\d+)$/.exec(hash);
		if (!m) return null;
		var abbr = m[1].toUpperCase();
		return books.find((b) => b.abbr.toUpperCase() === abbr) || null;
	}

	function currentBookChapter() {
		var hash = location.hash || "";
		var m = /^#([A-Za-z0-9]+)-(\d+)$/.exec(hash);
		return m ? m[2] : null;
	}

	// stopEl, when given, ends the scan: the next verse can start inside the
	// same paragraph, so its text is not part of the verse being built.
	function visibleTextNodes(p, stopEl) {
		if (!p || p.tagName != "P") return [];
		if (
			p.classList.contains("hdg") ||
			p.classList.contains("subhdg") ||
			p.classList.contains("cross")
		)
			return [];
		var nodes = [];
		var walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
		var node;
		while ((node = walker.nextNode())) {
			if (stopEl && stopEl.contains(node)) break;
			var el = node.parentNode;
			if (el && el.classList && el.classList.contains("fn")) continue;
			if (el && el.classList && el.classList.contains("cross1")) continue;
			if (el && el.style && el.style.display == "none") continue;
			nodes.push(node);
		}
		return nodes;
	}

	function buildVerseTokens(refEl) {
		var chapter = document.getElementById("chapter");
		if (!chapter) return { tokens: [], pos: [] };
		var refs = chapter.querySelectorAll(".reftext");
		var idx = Array.prototype.indexOf.call(refs, refEl);
		var nextRef = refs[idx + 1] || null;
		var tokens = [];
		var pos = [];
		var ps = Array.prototype.slice.call(chapter.querySelectorAll("p"));
		var from = refEl.closest("p") || chapter;
		var to = nextRef ? nextRef.closest("p") || chapter : null;
		var scanning = false;
		for (var i = 0; i < ps.length; i++) {
			var p = ps[i];
			if (p == from) scanning = true;
			if (!scanning) continue;
			var endsVerse = to && p == to;
			// A verse number only marks the end of the previous verse when it
			// sits in a later paragraph. When both numbers share a paragraph,
			// stop at the next number instead, or the verse is skipped whole.
			if (endsVerse && p != from) break;
			var nodes = visibleTextNodes(p, endsVerse ? nextRef : null);
			for (var n = 0; n < nodes.length; n++) {
				var text = nodes[n].nodeValue;
				var re = /[a-z']+/gi;
				var m;
				while ((m = re.exec(text))) {
					tokens.push(normWord(m[0]));
					pos.push({ node: nodes[n], start: m.index });
				}
			}
			if (endsVerse) break;
		}
		return { tokens: tokens, pos: pos };
	}

	function clickedTokenIndex(tokens, pos, node, offset) {
		for (var i = 0; i < pos.length; i++) {
			if (pos[i].node == node) {
				var len = tokens[i].length;
				if (offset >= pos[i].start && offset <= pos[i].start + len) {
					return i;
				}
			}
		}
		return -1;
	}

	function indexOfSubarray(tokens, sub, start) {
		for (var i = start || 0; i <= tokens.length - sub.length; i++) {
			var match = true;
			for (var j = 0; j < sub.length; j++) {
				if (tokens[i + j] != sub[j]) {
					match = false;
					break;
				}
			}
			if (match) return i;
		}
		return -1;
	}

	function findVerseEntry(entries, verseTokens, clickedIndex, clickedWord) {
		var tokens = verseTokens.tokens;
		var best = null;
		var bestScore = -1;
		for (var i = 0; i < entries.length; i++) {
			var w = entries[i].w;
			if (w.indexOf(clickedWord) == -1) continue;
			var start = -1;
			while ((start = indexOfSubarray(tokens, w, start + 1)) != -1) {
				var end = start + w.length - 1;
				var contains = clickedIndex >= start && clickedIndex <= end;
				var dist = contains
					? 0
					: Math.min(
							Math.abs(clickedIndex - start),
							Math.abs(clickedIndex - end),
						);
				var score = w.length * 100 + (contains ? 1000 : 0) - dist;
				if (score > bestScore) {
					bestScore = score;
					best = entries[i];
				}
			}
		}
		return best;
	}

	function applyWordStudyLinks(slug, chapterNum) {
		unwrapWordLinks();
		if (!settings.wordStudyLinks) return;
		if (!supportsWordStudy()) return;
		if (!slug) {
			var book = currentBook();
			if (!book) return;
			slug = book.slug;
		}
		if (!chapterNum) chapterNum = currentBookChapter();
		loadWordData(slug)
			.then(function () {
				// A stale lookup: the user has since navigated. A fresh
				// loadURL() invocation will have triggered its own wrap.
				var bookNow = currentBook();
				if (!bookNow || bookNow.slug != slug) return;
				if (currentBookChapter() != chapterNum) return;
				if (!settings.wordStudyLinks) return;
				var chapter = document.getElementById("chapter");
				if (!chapter) return;
				var refs = chapter.querySelectorAll(".reftext");
				Array.prototype.forEach.call(refs, function (refEl) {
					wrapVerseWords(slug, chapterNum, refEl);
				});
			})
			.catch(function () {});
	}

	function unwrapWordLinks() {
		var chapter = document.getElementById("chapter");
		if (!chapter) return;
		Array.prototype.slice
			.call(chapter.querySelectorAll(".word-link"))
			.forEach(function (span) {
				var parent = span.parentNode;
				while (span.firstChild) parent.insertBefore(span.firstChild, span);
				parent.removeChild(span);
			});
	}

	function wrapVerseWords(slug, chapterNum, refEl) {
		var verseNum = parseInt(refEl.id.substr(1), 10);
		if (isNaN(verseNum)) return;
		var verseKey = "" + parseInt(chapterNum, 10) + ":" + verseNum;
		var entries = wordDataEntry(slug, verseKey);
		if (!entries) return;
		var vt = buildVerseTokens(refEl);
		if (vt.pos.length == 0) return;
		var nodes = [];
		var i = 0;
		while (i < vt.pos.length) {
			var entry = findVerseEntry(entries, vt, i, vt.tokens[i]);
			if (!entry) {
				i++;
				continue;
			}
			// One original word is often rendered as several English words.
			// Underline the whole run as a single link, otherwise the reader
			// sees two separate underlines for one Hebrew or Greek term.
			var last = i;
			while (
				last + 1 < vt.pos.length &&
				findVerseEntry(entries, vt, last + 1, vt.tokens[last + 1]) === entry &&
				sameTextRun(vt, last, last + 1)
			) {
				last++;
			}
			var from = vt.pos[i];
			var to = rawTokenEnd(vt.pos[last]);
			if (to > from.start && !insideWordLink(from.node)) {
				pushRange(nodes, from.node, from.start, to);
			}
			i = last + 1;
		}
		nodes.forEach(function (g) {
			g.ranges.sort(function (a, b) {
				return a[0] - b[0];
			});
			wrapNodeRanges(g.node, g.ranges, "span", "word-link");
		});
	}

	// A verse's token window starts at the top of its paragraph, so it also
	// covers the words of the preceding verse. Wrapping those again would
	// nest one span inside another, so leave them to the verse that owns them.
	function insideWordLink(node) {
		for (var el = node.parentNode; el; el = el.parentNode) {
			if (el.classList && el.classList.contains("word-link")) return true;
		}
		return false;
	}

	// Two tokens can share one span only when they sit in the same text node
	// and nothing but punctuation separates them.
	function sameTextRun(vt, a, b) {
		var pa = vt.pos[a];
		var pb = vt.pos[b];
		if (pa.node !== pb.node || pb.start <= pa.start) return false;
		return !/[a-z0-9]/i.test(pa.node.nodeValue.slice(rawTokenEnd(pa), pb.start));
	}

	function rawTokenEnd(p) {
		return p.start + rawTokenLength(p.node.nodeValue, p.start);
	}

	function pushRange(nodes, node, start, end) {
		for (var i = 0; i < nodes.length; i++) {
			if (nodes[i].node === node) {
				nodes[i].ranges.push([start, end]);
				return;
			}
		}
		nodes.push({ node: node, ranges: [[start, end]] });
	}

	function rawTokenLength(text, start) {
		var re = /[a-z']+/gi;
		var m;
		while ((m = re.exec(text))) {
			if (m.index === start) return m[0].length;
			if (m.index > start) break;
		}
		return 0;
	}

	// Split one text node at the given ranges and wrap each range in an element.
	// The word study links and the chapter highlights are the same work on
	// different markup, so it is done once and the tag and class say which.
	function wrapNodeRanges(node, ranges, tag, className) {
		if (!ranges.length || !node.parentNode) return;
		var text = node.nodeValue;
		var frag = document.createDocumentFragment();
		var cursor = 0;
		for (var i = 0; i < ranges.length; i++) {
			var s = ranges[i][0];
			var e = ranges[i][1];
			if (s > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, s)));
			if (e > s) {
				var span = document.createElement(tag);
				span.className = className;
				span.textContent = text.slice(s, e);
				frag.appendChild(span);
			}
			cursor = Math.max(cursor, e);
		}
		if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
		node.parentNode.replaceChild(frag, node);
	}

	function strongLetter(lang) {
		if (lang == "Greek") return "G";
		if (lang == "Hebrew" || lang == "Aramaic") return "H";
		return "";
	}

	// A popup goes beside the click and turns above it when there is no room
	// below, clamped to the viewport either way. The word popup and the
	// footnote popup are the same card and are placed the same way.
	function positionPopup(popup, x, y) {
		var rect = popup.getBoundingClientRect();
		var left = Math.max(
			8,
			Math.min(x + 10, window.innerWidth - rect.width - 8),
		);
		var top = y + 12;
		if (top + rect.height > window.innerHeight - 8) {
			top = Math.max(8, y - rect.height - 12);
		}
		popup.style.left = left + "px";
		popup.style.top = top + "px";
	}

	// Only one popup is on screen at a time - a word and a footnote are never
	// both being asked about - so opening one puts the other away rather than
	// leaving two cards and two scroll guards on the page.
	function closeOtherPopup(openingId) {
		if (openingId == "wordPopup") closeFootnotePopup();
		else closeWordPopup();
	}

	// Whichever popup is on screen, or null when neither is.
	function openPopup() {
		var ids = ["wordPopup", "footnotePopup"];
		for (var i = 0; i < ids.length; i++) {
			var popup = document.getElementById(ids[i]);
			if (popup && popup.style.display != "none") return popup;
		}
		return null;
	}

	function closePopups() {
		closeWordPopup();
		closeFootnotePopup();
	}

	function openWordPopup(entry, ref, x, y, context) {
		closeOtherPopup("wordPopup");
		window.__popupOpenScrollY = window.scrollY;
		var popup = document.getElementById("wordPopup");
		if (!popup) {
			popup = document.createElement("div");
			popup.id = "wordPopup";
			popup.className = "word-popup";
			popup.setAttribute("data-cy", "wordPopup");

			var close = document.createElement("button");
			close.className = "word-popup-close";
			close.setAttribute("data-cy", "wordPopupClose");
			close.innerHTML = "&times;";
			close.addEventListener("click", function (e) {
				e.stopPropagation();
				closeWordPopup();
			});
			popup.appendChild(close);

			var refEl = document.createElement("div");
			refEl.className = "word-popup-ref";
			popup.appendChild(refEl);

			var orig = document.createElement("div");
			orig.className = "word-popup-orig";
			popup.appendChild(orig);

			var translit = document.createElement("div");
			translit.className = "word-popup-translit";
			popup.appendChild(translit);

			var parse = document.createElement("div");
			parse.className = "word-popup-parse";
			popup.appendChild(parse);

			var strong = document.createElement("div");
			strong.className = "word-popup-strong";
			popup.appendChild(strong);

			var gloss = document.createElement("div");
			gloss.className = "word-popup-gloss";
			popup.appendChild(gloss);

			// The way through to the page for this word. It is built here and
			// filled in per click, because a popup is reused for every word and
			// only some of them have a page.
			var study = document.createElement("button");
			study.type = "button";
			study.className = "word-popup-study";
			study.setAttribute("data-cy", "wordPopupStudy");
			study.addEventListener("click", function (e) {
				e.stopPropagation();
				openWordStudy(popup.__entry, popup.__context);
			});
			popup.appendChild(study);

			document.body.appendChild(popup);
		}

		popup.__entry = entry;
		popup.__context = context;

		var isHebrew =
			entry.l == "Hebrew" || entry.l == "Aramaic" || entry.l == "Aramaic (Biblical)";

		popup.querySelector(".word-popup-ref").textContent = ref;
		popup.querySelector(".word-popup-orig").textContent = entry.o;
		popup
			.querySelector(".word-popup-orig")
			.setAttribute("dir", isHebrew ? "rtl" : "ltr");
		popup
			.querySelector(".word-popup-orig")
			.setAttribute("lang", isHebrew ? "he" : "el");
		popup.querySelector(".word-popup-translit").textContent = entry.t;
		popup.querySelector(".word-popup-parse").textContent = entry.p;
		popup.querySelector(".word-popup-gloss").textContent = entry.e;

		// The tables leave the Hebrew particles unnumbered, and a word page is
		// keyed on the Strong's number, so those words stop at the popup.
		var study = popup.querySelector(".word-popup-study");
		if (entry.s && entry.s != "") {
			popup.querySelector(".word-popup-strong").textContent =
				"Strong's " + strongLetter(entry.l) + entry.s;
			study.textContent = "Word study ›";
			study.style.display = "";
		} else {
			popup.querySelector(".word-popup-strong").textContent = "No Strong's number";
			study.style.display = "none";
		}

		popup.style.display = "block";
		positionPopup(popup, x, y);
	}

	function closeWordPopup() {
		var popup = document.getElementById("wordPopup");
		if (popup) popup.style.display = "none";
		if (!openPopup()) window.__popupOpenScrollY = null;
	}

	function loadWordData(slug) {
		return new Promise(function (resolve, reject) {
			if (wordDataCache[slug]) return resolve(wordDataCache[slug]);
			fetch("wordData/" + slug + ".json?version=1")
				.then(function (r) {
					return r.json();
				})
				.then(function (data) {
					wordDataCache[slug] = data;
					resolve(data);
				})
				.catch(reject);
		});
	}

	function ignoreClickElement(el) {
		while (el && el != document.body) {
			if (
				el.classList.contains("hdg") ||
				el.classList.contains("subhdg") ||
				el.classList.contains("fn") ||
				el.classList.contains("cross") ||
				el.classList.contains("cross1") ||
				el.classList.contains("reftext") ||
				el.classList.contains("chapter-nav")
			)
				return true;
			el = el.parentNode;
		}
		return false;
	}

	function wordAtOffset(text, offset) {
		var re = /[a-z']+/gi;
		var m;
		while ((m = re.exec(text))) {
			if (offset >= m.index && offset <= m.index + m[0].length) {
				return normWord(m[0]);
			}
		}
		return null;
	}

	function nearestPrecedingReftext(node) {
		var refs = document
			.getElementById("chapter")
			.querySelectorAll(".reftext");
		var prev = null;
		for (var i = 0; i < refs.length; i++) {
			if (node.compareDocumentPosition(refs[i]) & Node.DOCUMENT_POSITION_FOLLOWING) {
				continue;
			}
			prev = refs[i];
		}
		return prev;
	}

	function caretPoint(x, y) {
		if (document.caretRangeFromPoint) {
			return document.caretRangeFromPoint(x, y);
		}
		if (document.caretPositionFromPoint) {
			var pos = document.caretPositionFromPoint(x, y);
			if (!pos) return null;
			var dummy = document.createRange();
			dummy.setStart(pos.offsetNode, pos.offset);
			return dummy;
		}
		// last resort: whatever element sits at the point
		var el = document.elementFromPoint(x, y);
		if (!el) return null;
		var dummy = document.createRange();
		dummy.selectNodeContents(el);
		dummy.collapse(true);
		return dummy;
	}

	document
		.getElementById("chapter")
		.addEventListener("click", function (ev) {
			// A marker in the text is a footnote, not a word, so it is answered
			// before anything else is considered and regardless of the word
			// study links - the notes are on screen, so their letters work.
			if (footnoteMarkerClicked(ev)) return;

			// The links are what tells the reader a word is tappable, so with
			// them off the text is not tappable and a click is just a click. The
			// lookup below is the same one they make on a linked word; there is
			// no word to look up without them.
			if (!settings.wordStudyLinks) return;
			if (!window.getSelection().isCollapsed) return;
			if (ignoreClickElement(ev.target)) return;

			var range = caretPoint(ev.clientX, ev.clientY);
			if (!range) return;
			var node = range.startContainer;
			var offset = range.startOffset;
			if (node.nodeType != 3) {
				var tc = node.childNodes[offset] || node;
				if (tc && tc.nodeType != 3) tc = tc.firstChild;
				if (!tc || tc.nodeType != 3) return;
				node = tc;
				offset = 0;
			}
			var clickedWord = wordAtOffset(node.nodeValue, offset);
			if (!clickedWord) return;

			var refEl = nearestPrecedingReftext(node);
			if (!refEl || refEl.contains(node)) return;
			var verseNum = parseInt(refEl.id.substr(1), 10);
			if (isNaN(verseNum)) return;

			var book = currentBook();
			if (!book) return;
			var chapter = currentBookChapter();
			var verseKey = "" + parseInt(chapter, 10) + ":" + verseNum;
			var refName = chapterRefName(book.name) + " " + chapter + ":" + verseNum;

			// All DOM interrogation happens synchronously while the nodes are
			// stable; only the word-data fetch is deferred.
			var vt = buildVerseTokens(refEl);
			if (vt.pos.length == 0) return;
			var clickedIndex = clickedTokenIndex(vt.tokens, vt.pos, node, offset);
			if (clickedIndex == -1) return;

			loadWordData(book.slug)
				.then(function (data) {
					var entries = wordDataEntry(book.slug, verseKey);
					if (!entries) return;
					var entry = findVerseEntry(entries, vt, clickedIndex, clickedWord);
					if (!entry) return;
					// The popup hands this on to the word's page, which needs to
					// know which verse the reader is standing in so its back
					// button and its "opened from" link can get them there.
					openWordPopup(entry, refName, ev.clientX, ev.clientY, {
						chapterLabel: chapterRefName(book.name) + " " + chapter,
						ref: refName,
						bookIndex: books.indexOf(book),
						verseKey: verseKey,
					});
				})
				.catch(function (e) {
					console.error("word lookup failed", e);
				});
		});

	// Close popup on outside pointerdown, Escape, scroll, or page change
	window.__popupOpenScrollY = null;
	document.addEventListener("pointerdown", function (ev) {
		var popup = openPopup();
		if (!popup) return;
		if (popup.contains(ev.target)) return;
		closePopups();
	});

	document.addEventListener("keydown", function (ev) {
		if (ev.key == "Escape") closePopups();
	});

	window.addEventListener(
		"scroll",
		function () {
			// Dismiss only when the user actually scrolls away from the position
			// where the popup opened. Some browsers/automation emit scroll events
			// at the same offset (scroll-into-view re-alignment) which must not
			// close the popup.
			if (window.__popupOpenScrollY !== null) {
				if (Math.abs(window.scrollY - window.__popupOpenScrollY) < 4) return;
				window.__popupOpenScrollY = null;
				closePopups();
			}
		},
		{ capture: true },
	);

	registerEventListener(
		(e) => e.name == "showPage",
		function () {
			closePopups();
		},
	);

	// ---------- Footnote popup ----------
	//
	// A footnote is a note about a verse, and the note is already in the page:
	// the block at the foot of the chapter holds every one of them. What was
	// missing was the way in - a reader had to scroll down to the block and
	// find the letter among the others. Clicking the letter in the text opens
	// the note itself, in the same card the word popup uses.

	// The block is a flat run of nodes: a verse number, a letter, then the
	// note, then the next verse number. Nothing wraps a note, so it is read
	// back out of the DOM once per chapter and kept as the nodes it was, since
	// the note is written as a run of elements - alternative readings in
	// italics among them - rather than as a string.
	var footnoteEntries = null;

	function isFootnoteSpacer(node) {
		// The epub separates the notes with empty spacer paragraphs of its own,
		// which say nothing and would otherwise open a blank line in the popup.
		return (
			node.nodeType == 1 &&
			node.classList.contains("calibre2") &&
			!node.textContent.trim()
		);
	}

	function footnoteIndex() {
		if (footnoteEntries) return footnoteEntries;
		footnoteEntries = [];
		var block = document.querySelector("#chapter div.fn");
		if (!block) return footnoteEntries;

		var verse = "";
		var entry = null;
		var nodes = block.childNodes;
		for (var i = 0; i < nodes.length; i++) {
			var node = nodes[i];
			if (node.nodeType == 1 && node.classList.contains("fnverse")) {
				verse = node.textContent.trim();
				continue;
			}
			if (node.nodeType == 1 && node.classList.contains("footnotesbot")) {
				entry = { verse: verse, letter: node.textContent.trim(), nodes: [] };
				footnoteEntries.push(entry);
				continue;
			}
			// Everything before the first letter is the heading and the anchor
			// it hangs from, and a spacer between two notes is the epub's, not
			// the note's. Everything else - the words of the note, and the
			// italics among them - belongs to the letter above it.
			if (!entry || isFootnoteSpacer(node)) continue;
			entry.nodes.push(node);
		}

		// A note opens with its alternative reading ("Or tabernacled...") and
		// closes at the end of the run of text before the next letter, so the
		// whitespace at either edge is the block's spacing rather than the
		// note's words.
		for (var j = 0; j < footnoteEntries.length; j++) {
			var held = footnoteEntries[j].nodes;
			while (
				held.length &&
				held[0].nodeType == 3 &&
				!held[0].nodeValue.trim()
			)
				held.shift();
			while (
				held.length &&
				held[held.length - 1].nodeType == 3 &&
				!held[held.length - 1].nodeValue.trim()
			)
				held.pop();
		}

		return footnoteEntries;
	}

	function findFootnote(verse, letter) {
		var list = footnoteIndex();
		var i;
		for (i = 0; i < list.length; i++) {
			if (list[i].letter == letter && (!verse || list[i].verse == verse))
				return list[i];
		}
		// A letter is only ever used once in a chapter, so a marker whose verse
		// is not the one the note is filed under still finds its note - a
		// psalm's superscription carries one with no verse of its own before it.
		for (i = 0; i < list.length; i++) {
			if (list[i].letter == letter) return list[i];
		}
		return null;
	}

	// The marker in the verse text, or null. The letter in the block at the
	// foot of the chapter carries the same class but is the note itself, so it
	// is not something to click.
	function footnoteMarkerAt(el) {
		while (el && el != document.body) {
			if (el.classList && el.classList.contains("fn")) {
				return el.tagName == "SPAN" ? el : null;
			}
			el = el.parentNode;
		}
		return null;
	}

	// Answers a click on a footnote letter. Returns true when the click was one,
	// so the caller knows there is nothing else to do with it.
	function footnoteMarkerClicked(ev) {
		if (!settings.footnotes) return false;
		var marker = footnoteMarkerAt(ev.target);
		if (!marker) return false;
		var letter = marker.textContent.trim();
		if (!letter) return false;

		// The verse the marker stands in, for the popup's own line. A psalm's
		// superscription has no verse number before it, and its note belongs to
		// no verse, so the popup names the chapter alone.
		var refEl = nearestPrecedingReftext(marker);
		var verseNum = refEl ? parseInt(refEl.id.substr(1), 10) : NaN;

		var entry = findFootnote(isNaN(verseNum) ? "" : verseNum, letter);
		if (!entry) return false;

		var book = currentBook();
		if (!book) return false;
		var label = chapterRefName(book.name) + " " + currentBookChapter();
		if (!isNaN(verseNum)) label += ":" + verseNum;

		openFootnotePopup(entry, label, ev.clientX, ev.clientY);
		return true;
	}

	function openFootnotePopup(entry, ref, x, y) {
		closeOtherPopup("footnotePopup");
		window.__popupOpenScrollY = window.scrollY;

		var popup = document.getElementById("footnotePopup");
		if (!popup) {
			// The word popup's own class, so the two read as one kind of card:
			// same shell, same close button, same ref line.
			popup = document.createElement("div");
			popup.id = "footnotePopup";
			popup.className = "word-popup footnote-popup";
			popup.setAttribute("data-cy", "footnotePopup");

			var close = document.createElement("button");
			close.className = "word-popup-close";
			close.setAttribute("data-cy", "footnotePopupClose");
			close.innerHTML = "&times;";
			close.addEventListener("click", function (e) {
				e.stopPropagation();
				closeFootnotePopup();
			});
			popup.appendChild(close);

			var refEl = document.createElement("div");
			refEl.className = "word-popup-ref";
			popup.appendChild(refEl);

			var verse = document.createElement("div");
			verse.className = "footnote-popup-verse";
			popup.appendChild(verse);

			var text = document.createElement("div");
			text.className = "footnote-popup-text";
			popup.appendChild(text);

			document.body.appendChild(popup);
		}

		popup.querySelector(".word-popup-ref").textContent =
			"Footnote " + entry.letter;
		popup.querySelector(".footnote-popup-verse").textContent = ref;

		// The note is copied across as the nodes it was rather than as its
		// text, so the alternative readings the BSB italicises stay italicised.
		var body = popup.querySelector(".footnote-popup-text");
		body.innerHTML = "";
		for (var i = 0; i < entry.nodes.length; i++) {
			body.appendChild(entry.nodes[i].cloneNode(true));
		}

		popup.style.display = "block";
		positionPopup(popup, x, y);
	}

	function closeFootnotePopup() {
		var popup = document.getElementById("footnotePopup");
		if (popup) popup.style.display = "none";
		if (!openPopup()) window.__popupOpenScrollY = null;
	}

	// ---------- Highlights ----------
	//
	// A search result, a verse on a word study page, and a reference typed into a
	// jump field all send the reader to a chapter with something in mind. The
	// chapter marks it - words to look at, or the whole of a verse - so it can
	// be seen where it is, and the button in the corner takes it away again.
	// Nothing is kept: the next chapter, or the next page of any kind, starts
	// unmarked.

	// What is on screen, as { terms, partial, label } for words or
	// { verse, label } for a verse, or null when nothing is marked. A page that
	// arrives with something in hand leaves it in window.pendingHighlight, which
	// loadURL picks up - the same way window.scrollVerse carries the verse to
	// scroll to - or calls applyChapterHighlight() itself when the chapter is
	// already on screen.
	var chapterHighlight = null;

	function applyChapterHighlight(request) {
		var wanted =
			request && ((request.terms && request.terms.length) || request.verse);
		chapterHighlight = wanted ? request : null;
		renderHighlights();
	}

	function clearChapterHighlight() {
		window.pendingHighlight = null;
		applyChapterHighlight(null);
	}

	function goPrevSearchResult() {
		goSearchResult(-1);
	}

	// Back to the search that brought the reader here, with the results still
	// listed, so another of them can be picked.
	function goBackToSearchResults() {
		var q = window.lastSearch && window.lastSearch.q;
		if (q) window.pendingSearchQuery = q;
		fireEvent({ name: "showPage", page: "search" });
	}

	function goNextSearchResult() {
		goSearchResult(1);
	}

	function goSearchResult(delta) {
		var results = window.searchResults;
		if (!Array.isArray(results) || !results.length) return;
		var idx = window.currentSearchResultIndex;
		if (typeof idx !== "number" || idx < 0) idx = 0;
		idx += delta;
		if (idx < 0 || idx >= results.length) return;
		window.currentSearchResultIndex = idx;
		var rec = results[idx];
		window.currentSearchResultVerse = rec[2];
		var book = books.find(function (b) {
			return b.slug === rec[0];
		});
		if (!book) return;

		// A match in the chapter already on screen needs no fetch: the text is
		// there, so the marks are redone and the reader is taken to the verse.
		var sameChapter =
			books[currentBookIndex] &&
			books[currentBookIndex].slug === book.slug &&
			rec[1] === currentChapter;
		if (sameChapter) {
			if (chapterHighlight && chapterHighlight.terms) {
				applyChapterHighlight({
					terms: chapterHighlight.terms,
					partial: chapterHighlight.partial,
					label: chapterHighlight.label,
				});
			}
			scrollToVerse(rec[2]);
			return;
		}

		window.scrollVerse = rec[2];
		if (chapterHighlight && chapterHighlight.terms) {
			window.pendingHighlight = {
				terms: chapterHighlight.terms,
				partial: chapterHighlight.partial,
				label: chapterHighlight.label,
			};
		}
		loadThisChapter(book.name, book.slug, rec[1]);
	}

	// Takes the reader to a verse in the chapter already on screen, the same
	// way arriving at a chapter does.
	function scrollToVerse(verseNum) {
		if (!verseNum) return;
		if (pageTurning.enabled) {
			setTimeout(function () {
				jumpToPageWithVerse(verseNum);
			}, 0);
			return;
		}
		var verseEl = document.getElementById("v" + verseNum);
		var scrollTarget = (verseEl && verseEl.closest("p")) || verseEl;
		if (!scrollTarget) return;
		scrollTarget.scrollIntoView({ block: "center" });
	}

	// The marks belonged to the words the reader was looking for, so any other
	// page takes them away. Another chapter does it the same way, by arriving
	// without any.
	registerEventListener(
		(e) => e.name == "showPage" && e.page != "chapter",
		function () {
			clearChapterHighlight();
		},
	);

	function renderHighlights() {
		var nav = document.getElementById("highlightNav");
		var button = document.getElementById("clearHighlights");
		var prevBtn = document.getElementById("prevSearchResult");
		var nextBtn = document.getElementById("nextSearchResult");
		unwrapHighlights();

		if (!chapterHighlight) {
			if (nav) nav.style.display = "none";
			return;
		}

		var count = chapterHighlight.verse
			? markVerse(chapterHighlight.verse)
			: markWords(chapterHighlight.terms, chapterHighlight.partial);

		if (!nav) return;

		if (chapterHighlight.verse) {
			// A verse the chapter does not have - the reader typed a number out of
			// range - leaves nothing to take away, so no button either.
			if (!count) {
				nav.style.display = "none";
				return;
			}
			if (button) button.textContent = "Hide highlight";
			if (button)
				button.title =
					"Hide the highlight on " + (chapterHighlight.label || "this verse");
		} else {
			if (button) button.textContent = "Clear";
			if (button)
				button.title = chapterHighlight.label
					? "Clear the highlights for " + chapterHighlight.label
					: "Clear the highlights";
		}

		// Next/prev only make sense for a search result's highlights, and only
		// when there is a recorded list of results to move through.
		var isSearch =
			!chapterHighlight.verse &&
			chapterHighlight.terms &&
			chapterHighlight.terms.length;
		var hasResults =
			Array.isArray(window.searchResults) &&
			window.searchResults.length > 0;
		if (prevBtn) prevBtn.style.display = isSearch && hasResults ? "" : "none";
		if (nextBtn) nextBtn.style.display = isSearch && hasResults ? "" : "none";

		var posEl = document.getElementById("backToSearchResults");
		if (posEl) {
			if (isSearch && hasResults) {
				var ci = window.currentSearchResultIndex;
				if (typeof ci !== "number" || ci < 0) ci = 0;
				var total = (window.searchResults || []).length;
				posEl.textContent = (ci + 1) + "/" + total;
				posEl.style.display = "";
			} else {
				posEl.style.display = "none";
			}
		}

		// The match the reader is on is marked differently from the others in
		// the chapter, so it is clear which one Next and Prev are moving
		// between.
		if (isSearch && window.currentSearchResultVerse) {
			markCurrentVerseMatches(window.currentSearchResultVerse);
		}

		nav.style.display = "flex";
	}

	// A verse runs from its own marker to the next one, so the matches that
	// belong to it are the ones between the two markers - not everything in
	// the paragraph, which can hold several verses.
	function markCurrentVerseMatches(verseNum) {
		var text = document.getElementById("chapterText");
		var marker = document.getElementById("v" + verseNum);
		if (!text || !marker) return;
		var markers = [].slice.call(text.querySelectorAll(".reftext"));
		var next = markers[markers.indexOf(marker) + 1] || null;
		Array.prototype.slice
			.call(text.querySelectorAll("mark.chapter-hl"))
			.forEach(function (mark) {
				if (
					!(
						marker.compareDocumentPosition(mark) &
						Node.DOCUMENT_POSITION_FOLLOWING
					)
				)
					return;
				if (
					next &&
					!(next.compareDocumentPosition(mark) & Node.DOCUMENT_POSITION_PRECEDING)
				)
					return;
				mark.classList.add("chapter-hl-current");
			});
	}

	function markWords(terms, partial) {
		var count = 0;
		var text = document.getElementById("chapterText");
		if (text) {
			highlightableTextNodes(text).forEach(function (node) {
				var ranges = highlightRangesIn(node, terms, partial);
				if (!ranges.length) return;
				count += ranges.length;
				wrapNodeRanges(node, ranges, "mark", "chapter-hl");
			});
		}
		return count;
	}

	// A reference that names a verse is asking for that verse, so the whole of it
	// is marked rather than words in it. A verse runs from its own marker to the
	// next one, which can be in the next paragraph, so it is the text between the
	// two markers.
	function markVerse(verseNum) {
		var text = document.getElementById("chapterText");
		var marker = document.getElementById("v" + verseNum);
		if (!text || !marker) return 0;
		var markers = [].slice.call(text.querySelectorAll(".reftext"));
		var next = markers[markers.indexOf(marker) + 1] || null;

		var count = 0;
		highlightableTextNodes(text).forEach(function (node) {
			// Where the piece sits in the chapter, by the two markers it belongs
			// between rather than by an offset into the text: a range's ends are
			// inside it as far as it is concerned, and the first word of the next
			// verse would come with them.
			if (!(marker.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING)) return;
			if (next && !(next.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_PRECEDING)) return;
			// A heading stands between two verses and belongs to neither.
			for (var el = node.parentNode; el && el !== text; el = el.parentNode) {
				if (
					el.classList &&
					(el.classList.contains("hdg") || el.classList.contains("subhdg"))
				)
					return;
			}
			if (!node.nodeValue.length) return;
