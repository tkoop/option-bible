<div id="historyLinks"></div>

<script>

var historyFilterValue = "all"

function setHistoryFilter(value) {
  historyFilterValue = value
  recreateHistory()
}

function historyDayLabel(date) {
  return new Date(Date.parse(date)).toLocaleDateString('en-CA', {
    month: 'short', // this order has nothing to do with the output
    day: 'numeric',
    year: 'numeric'
  })
}

function historyUsedActivityIds(entries) {
  const used = {}
  entries.forEach(entry => used[activityType(entry.activity).id] = true)
  return ACTIVITY_TYPES.filter(type => used[type.id]).map(type => type.id)
}

function historyEntryHtml(entry) {
  let html = "<span class='history-entry " + activityClass(entry.activity) + "'>"
  html += "<a href='#' style='white-space:nowrap' data-slug='" + entry.slug + "'"
  html += " data-book='" + entry.name + "' data-chapter='" + entry.chapter + "'"
  html += " data-activity='" + activityType(entry.activity).id + "'"
  html += " onclick='loadHistoryChapter(this); return false'>" + chapterRefName(entry.name) + " " + entry.chapter + "</a>"
  if (entry.finished) html += "<span class='history-finished'>*</span>"
  return html + "</span>"
}

// Reading an old chapter continues under the activity it was first read with,
// so the next history entry joins the same activity.
function loadHistoryChapter(element) {
  fireEvent({ name: "setSetting", setting: "activity", value: element.dataset.activity })
  loadChapter(element)
}

// Only the activity types actually used are offered, so the legend stays short.
function historyLegendHtml(ids) {
  if (ids.length == 0) return ""
  let html = "<div class='history-legend'>"
  ids.forEach(id => {
    html += "<span class='history-legend-item " + activityClass(id) + "'>"
    html += "<span class='history-legend-swatch'></span>" + activityLabel(id) + "</span>"
  })
  return html + "</div>"
}

function historyFilterHtml(ids) {
  let html = "<div class='history-filter'>"
  html += "<label class='history-filter-label' for='historyFilterSelect'>Show</label>"
  html += "<select id='historyFilterSelect' class='history-filter-select"
  if (historyFilterValue != "all") html += " " + activityClass(historyFilterValue)
  html += "' onchange='setHistoryFilter(this.value)'>"
  html += "<option value='all'" + (historyFilterValue == "all" ? " selected" : "") + ">All activities</option>"
  ids.forEach(id => {
    html += "<option value='" + id + "'" + (historyFilterValue == id ? " selected" : "") + ">" + activityLabel(id) + "</option>"
  })
  return html + "</select></div>"
}

function recreateHistory() {
  // Re-read from storage so the list is never stale, even if it was updated
  // in another tab or the in-memory copy drifted.
  try {
    settings.browseHistory = JSON.parse(localStorage?.browseHistory ?? "[]")
  } catch (e) {}
  const entries = settings.browseHistory.filter(entry => entry && entry.slug)
  let html = ""

  if (entries.length == 0) {
    html = "<h2>History</h2><p style='font-style:italic'>No history</p>"
  } else {
    const ids = historyUsedActivityIds(entries)
    // a filter left over from a history that no longer has that activity
    if (ids.indexOf(historyFilterValue) == -1) historyFilterValue = "all"
    const shown = historyFilterValue == "all"
      ? entries
      : entries.filter(entry => activityType(entry.activity).id == historyFilterValue)

    html += "<div class='history-header'><h2>History</h2>" + historyFilterHtml(ids) + "</div>"
    html += "<p style='font-style:italic;font-size:0.85em'>* = finished to the end of the chapter</p>"
    html += historyLegendHtml(ids)
    let previousDate = null
    for (let i = shown.length - 1; i >= 0; i--) {
      const entry = shown[i]
      if (entry.date != previousDate) {
        if (previousDate != null) html += "</div>"
        previousDate = entry.date
        html += "<h3>" + historyDayLabel(entry.date) + "</h3><div class='history-day'>"
      }
      html += historyEntryHtml(entry)
    }
    html += "</div>"
  }

  document.getElementById("historyLinks").innerHTML = html

}

recreateHistory()


registerEventListener(e => e.name == "showPage" && e.page=="history", function(event) {
  recreateHistory()
})

// Refresh whenever the page becomes visible again, so a stale list is never
// shown after reading chapters or returning from another tab.
function refreshHistoryIfVisible() {
  if (window.currentPage === "history" && document.visibilityState === "visible") {
    recreateHistory()
  }
}
document.addEventListener("visibilitychange", refreshHistoryIfVisible)
window.addEventListener("focus", refreshHistoryIfVisible)


</script>
