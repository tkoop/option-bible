<!-- A shared link's four settings are the sharer's, so they are shown as a
     notice with the two ways out of it, and the four rows they stand in for
     step aside until one of the two is taken. -->
<div class="shared-note" id="sharedNote" data-cy="sharedNote" style="display: none">
	<div class="shared-note-label">Using shared settings</div>
	<div class="shared-note-actions">
		<button
			id="adoptShared"
			data-cy="adoptShared"
			onclick="adoptSharedSettings(); event.stopPropagation()"
			title="Keep these as your own settings"
		>
			Adopt
		</button>
		<button
			id="discardShared"
			data-cy="discardShared"
			onclick="discardSharedSettings(); event.stopPropagation()"
			title="Go back to your own settings"
		>
			Discard
		</button>
	</div>
</div>

<div class="version-setting" style="display: flex">
	<div>Spelling</div>

			style="padding: 6px; border-radius: 6px"
			id="spelling"
			onclick="event.stopPropagation()"
			onchange="fireEvent({name:'setSetting', setting:'spelling', value:this.options[this.selectedIndex].value}); event.stopPropagation()"

<hr class="menu-divider" />

<div onclick="fireEvent({name:'advancedMenuRequested', eventObject:event})">Advanced</div>

<script>
	// Every setting here changes how a chapter reads, so the gear menu only
	// exists on a chapter page: the icon goes away with the rest of the chrome
	// elsewhere, and the menu is dismissed if you navigate away mid-read.
	// Component scripts share the global scope, so this reads the page the
	// router published rather than keeping a copy that can fall behind.
	function hideSettingsDropDown() {
		document.getElementById("settingsDropdown").style.display = "none";
	}

	function applyGearIcon() {
		document.getElementById("gearIcon").style.display =
			window.currentPage === "chapter" ? "block" : "none";
	}

	registerEventListener(
		(e) => e.name == "gearIconClicked",
		function (event) {
			if (window.currentPage !== "chapter") return;
			document.getElementById("dropdown").style.display = "none";
			event.eventObject.stopPropagation();
			const dd = document.getElementById("settingsDropdown");
			dd.style.display = dd.style.display === "block" ? "none" : "block";
		}
	);

	registerEventListener(
		(e) => e.name == "showPage",
		function (event) {
			applyGearIcon();
			if (window.currentPage !== "chapter") hideSettingsDropDown();
		}
	);

	window.addEventListener("click", () => {
		hideSettingsDropDown();
	});

	// The menu is built once, so it is re-synced whenever the settings change
	// underneath it - a shared link applies its own four before the reader has
	// opened the menu at all.
	function applySettingsToMenu() {
		// A shared link's settings are not the reader's to change while they are
		// in use, so the notice says so and the four rows give way to it. The
		// values themselves are still in the version tag beside the chapter.
		var shared = usingSharedSettings();
		document.getElementById("sharedNote").style.display = shared ? "" : "none";
		document
			.querySelectorAll("#settingsDropdown .version-setting")
			.forEach((row) => (row.style.display = shared ? "none" : ""));

		document.querySelectorAll("select#spelling option").forEach((op) => {
			if (op.value == settings.spelling) op.selected = true;
		});

		document.querySelectorAll("select#name option").forEach((op) => {
			if (op.value == settings.name) op.selected = true;
		});

		document.querySelectorAll("select#case option").forEach((op) => {
			if (op.value == settings.case) op.selected = true;
		});

		document.querySelectorAll("select#you option").forEach((op) => {
			if (op.value == settings.you) op.selected = true;
		});

		document.querySelectorAll("select#style option").forEach((op) => {
			if (op.value == settings.style) op.selected = true;
		});

		document.querySelector("input[data-value=titles]").checked =
			settings.titles;
		document.querySelector("input[data-value=footnotes]").checked =
			settings.footnotes;
		document.querySelector("input[data-value=references]").checked =
			settings.references;
		document.querySelector("input[data-value=verses]").checked =
			settings.verses;
		document.querySelector("input[data-value=woc]").checked = settings.woc;
	}

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function () {
			applySettingsToMenu();
		},
	);

	applySettingsToMenu();
</script>
