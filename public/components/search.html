<h1>Search</h1>

<div class="search-controls">
	<input
		id="searchInput"
		type="search"
		placeholder="Search the entire Bible..."
		autocomplete="off"
		spellcheck="false"
	/>
	<button
		type="button"
		class="home-button"
		onclick="runSearch(document.getElementById('searchInput').value, true)"
	>
		Search
	</button>
	<select id="searchScope" title="What to search in"></select>
	<div class="search-mode">
		<label
			><input type="radio" name="searchMode" value="phrase" checked />
			Exact phrase</label
		>
		<label
			><input type="radio" name="searchMode" value="words" /> Each
			word</label
		>
		<label class="search-partial"
			><input type="checkbox" id="searchPartial" checked /> Partial</label
		>
	</div>
</div>

<div id="searchHistory"></div>
<div id="searchStatus" class="search-status"></div>
<div id="searchResults" class="search-results"></div>

<script>
	var searchIndex = null;
	var searchIndexLoading = null;
	var lastSearchStyle = settings.style;
	var bookNames = {};
	var lastSearch = null;
	var HISTORY_KEY = "searchHistory";
	var HISTORY_LIMIT = 15;

	books.forEach((b) => (bookNames[b.slug] = b.name));

	function bookRange(first, last) {
		var start = books.findIndex((b) => b.name === first);
		var end = books.findIndex((b) => b.name === last);
		if (start < 0 || end < 0 || start > end) return [];
		return books.slice(start, end + 1).map((b) => b.slug);
	}

	var SCOPES = [
		{ key: "whole", label: "The whole Bible", slugs: null },
		{ key: "nt", label: "New Testament", slugs: bookRange("Matthew", "Revelation") },
		{ key: "ot", label: "Old Testament", slugs: bookRange("Genesis", "Malachi") },
		{ key: "gospels", label: "Gospels", slugs: bookRange("Matthew", "John") },
		{ key: "acts", label: "Acts", slugs: bookRange("Acts", "Acts") },
		{ key: "paul", label: "Paul's Letters", slugs: bookRange("Romans", "Philemon") },
		{ key: "general", label: "General Letters", slugs: bookRange("Hebrews", "Jude") },
		{ key: "pentateuch", label: "Pentateuch", slugs: bookRange("Genesis", "Deuteronomy") },
		{ key: "history", label: "Historical Books", slugs: bookRange("Joshua", "Esther") },
		{ key: "wisdom", label: "Wisdom Books", slugs: bookRange("Job", "Song of Solomon") },
		{ key: "major", label: "Major Prophets", slugs: bookRange("Isaiah", "Daniel") },
		{ key: "minor", label: "Minor Prophets", slugs: bookRange("Hosea", "Malachi") },
	];

	var scopeSelect = document.getElementById("searchScope");

	function buildScopeOptions() {
		SCOPES.forEach(function (s) {
			var opt = document.createElement("option");
			opt.value = s.key;
			opt.textContent = s.label;
			scopeSelect.appendChild(opt);
		});
		var sep = document.createElement("option");
		sep.disabled = true;
		sep.textContent = "— Books —";
		scopeSelect.appendChild(sep);
		books.forEach(function (b) {
			var opt = document.createElement("option");
			opt.value = "book:" + b.slug;
			opt.textContent = b.name;
			scopeSelect.appendChild(opt);
		});
		var saved = localStorage.searchScope;
		if (saved && [].some.call(scopeSelect.options, (o) => o.value === saved))
			scopeSelect.value = saved;
	}
	buildScopeOptions();

	function scopeLabel(value) {
		if (value === "book:") return "";
		if (value && value.indexOf("book:") === 0) {
			var slug = value.slice(5);
			return bookNames[slug] || slug;
		}
		var s = SCOPES.find((s) => s.key === value);
		return s ? s.label : "";
	}

	function currentScopeSlugs() {
		var v = scopeSelect.value;
		if (v === "whole") return null;
		if (v.indexOf("book:") === 0) return [v.slice(5)];
		var s = SCOPES.find((s) => s.key === v);
		return s ? s.slugs : null;
	}

	function currentMode() {
		var el = document.querySelector('input[name="searchMode"]:checked');
		return el ? el.value : "phrase";
	}

	function setMode(mode) {
		var el = document.querySelector('input[name="searchMode"][value="' + mode + '"]');
		if (el) el.checked = true;
	}

	var partialEl = document.getElementById("searchPartial");

	function currentPartial() {
		return partialEl.checked;
	}

	function setPartial(value) {
		partialEl.checked = value !== false;
	}

	var savedMode = localStorage.searchMode;
	if (savedMode === "words" || savedMode === "phrase") setMode(savedMode);
	var savedPartial = localStorage.searchPartial;
	setPartial(
		savedPartial === null || savedPartial === undefined || savedPartial === "1"
	);

	registerEventListener(
		(e) => e.name == "showPage" && e.page == "search",
		function (event) {
			var input = document.getElementById("searchInput");
			if (!input) return;
			input.focus();
			renderSearchHistory();
			if (window.pendingSearchQuery) {
				var query = window.pendingSearchQuery;
				window.pendingSearchQuery = null;
				input.value = query;
				runSearch(query, true);
			}
		}
	);

	function loadSearchIndex() {
		if (searchIndex) return Promise.resolve(searchIndex);
		if (searchIndexLoading) return searchIndexLoading;
		searchIndexLoading = fetch(searchUrl() + "?version=3")
			.then((r) => r.json())
			.then((data) => {
				searchIndex = data;
				return data;
			})
			.catch((err) => {
				searchIndexLoading = null;
				throw err;
			});
		return searchIndexLoading;
	}

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function (event) {
			if (settings.style === lastSearchStyle) return;
			lastSearchStyle = settings.style;
			searchIndex = null;
			searchIndexLoading = null;
			var input = document.getElementById("searchInput");
			if (input && input.value) runSearch(input.value, false);
		}
	);

	var debounceTimer = null;
	var inputEl = document.getElementById("searchInput");
	inputEl.addEventListener("input", function (event) {
		clearTimeout(debounceTimer);
		debounceTimer = setTimeout(function () {
			runSearch(event.target.value, false);
		}, 250);
	});
	inputEl.addEventListener("keydown", function (event) {
		if (event.key === "Enter") {
			clearTimeout(debounceTimer);
			runSearch(event.target.value, true);
		}
	});
	scopeSelect.addEventListener("change", function () {
		localStorage.searchScope = scopeSelect.value;
		runSearch(inputEl.value, false);
	});
	document.querySelectorAll('input[name="searchMode"]').forEach(function (radio) {
		radio.addEventListener("change", function () {
			localStorage.searchMode = currentMode();
			runSearch(inputEl.value, false);
		});
	});
	partialEl.addEventListener("change", function () {
		localStorage.searchPartial = partialEl.checked ? "1" : "0";
		runSearch(inputEl.value, false);
	});

	// findTerm() and findTermRanges() live in the chapter component: the chapter
	// marks the words a result is opened for, and the two have to agree about
	// what a search matched.

	// The search itself, as a promise of the matches it found. The results page
	// shows them, and the quick jump takes the reader straight to the first
	// one, so both go through here and agree about what was found.
	function runSearch(query, record) {
		query = (query || "").trim().toLowerCase();
		var mode = currentMode();
		var partial = currentPartial();
		var scope = scopeSelect.value;
		var slugs = currentScopeSlugs();
		var slugSet = slugs ? new Set(slugs) : null;
		lastSearch = { q: query, mode: mode, scope: scope, partial: partial };
		window.lastSearch = lastSearch;
		var status = document.getElementById("searchStatus");
		var box = document.getElementById("searchResults");
		box.innerHTML = "";
		status.textContent = "";

		if (record && query) recordSearch(lastSearch);
		if (!query) return Promise.resolve([]);

		status.textContent = "Searching...";
		return loadSearchIndex()
			.then(function () {
				var terms =
					mode === "words"
						? query.split(/\s+/).filter(Boolean)
						: [query];
				if (!terms.length) return [];
				var t0 = performance.now();
				var hits = [];
				for (var i = 0; i < searchIndex.length; i++) {
					var rec = searchIndex[i];
					if (slugSet && !slugSet.has(rec[0])) continue;
					var lower = rec[3].toLowerCase();
					var match = true;
					for (var j = 0; j < terms.length; j++) {
						if (findTerm(lower, terms[j], partial, 0) < 0) {
							match = false;
							break;
						}
					}
					if (match) hits.push(rec);
				}
				var ms = Math.round(performance.now() - t0);
				status.textContent =
					hits.length +
					" match" +
					(hits.length == 1 ? "" : "es") +
					" \u00b7 " +
					ms +
					" ms";
				// Every match is kept, so the count and the stepping through them
				// are the whole search rather than only what fits on the page.
				window.searchResults = hits;
				window.searchResultsTotal = hits.length;
				renderResults(box, hits, terms, partial);
				return hits;
			})
			.catch(function () {
				status.textContent = "Could not load the search index.";
				return [];
			});
	}

	function renderResults(box, hits, terms, partial) {
		var MAX_RESULTS = 200;
		var frag = document.createDocumentFragment();

		for (var i = 0; i < hits.length && i < MAX_RESULTS; i++) {
			var rec = hits[i];
			var row = document.createElement("div");
			row.className = "search-result";

			var ref = document.createElement("span");
			ref.className = "search-ref";
			ref.textContent =
				chapterRefName(bookNames[rec[0]]) + " " + rec[1] + ":" + rec[2];

			var text = document.createElement("span");
			text.className = "search-text";
			text.appendChild(highlight(rec[3], terms, partial));

			row.appendChild(ref);
			row.appendChild(text);
			row.onclick = (function (rec) {
				return function () {
					openVerse(rec);
				};
			})(rec);
			frag.appendChild(row);
		}

		box.appendChild(frag);
		if (hits.length > MAX_RESULTS) {
			var status = document.getElementById("searchStatus");
			var more = document.createElement("span");
			more.className = "search-more";
			more.textContent =
				"  Showing first " + MAX_RESULTS + " of " + hits.length + ".";
			status.appendChild(more);
		}
	}

	function highlight(text, terms, partial) {
		var frag = document.createDocumentFragment();
		var ranges = findTermRanges(text, terms, partial);
		var pos = 0;
		ranges.forEach(function (range) {
			if (range[0] > pos)
				frag.appendChild(document.createTextNode(text.substring(pos, range[0])));
			var mark = document.createElement("mark");
			mark.appendChild(
				document.createTextNode(text.substring(range[0], range[1])),
			);
			frag.appendChild(mark);
			pos = range[1];
		});
		if (pos < text.length)
			frag.appendChild(document.createTextNode(text.substring(pos)));
		if (frag.childNodes.length == 0)
			frag.appendChild(document.createTextNode(text));
		return frag;
	}

	function getSearchHistory() {
		try {
			var list = JSON.parse(localStorage[HISTORY_KEY] || "[]");
			return Array.isArray(list) ? list : [];
		} catch (e) {
			return [];
		}
	}

	function recordSearch(entry) {
		if (!entry || !entry.q) return;
		var partial = entry.partial !== false;
		var list = getSearchHistory().filter(function (e) {
			return !(
				e.q === entry.q &&
				e.mode === entry.mode &&
				e.scope === entry.scope &&
				(e.partial !== false) === partial
			);
		});
		list.unshift({
			q: entry.q,
			mode: entry.mode,
			scope: entry.scope,
			partial: partial,
		});
		if (list.length > HISTORY_LIMIT) list.length = HISTORY_LIMIT;
		localStorage[HISTORY_KEY] = JSON.stringify(list);
		renderSearchHistory();
	}

	function clearSearchHistory() {
		localStorage.removeItem(HISTORY_KEY);
		renderSearchHistory();
	}

	function renderSearchHistory() {
		var el = document.getElementById("searchHistory");
		if (!el) return;
		var list = getSearchHistory();
		el.innerHTML = "";
		if (!list.length) return;

		var heading = document.createElement("div");
		heading.className = "search-history-heading";
		var title = document.createElement("span");
		title.textContent = "Recent searches";
		var clear = document.createElement("button");
		clear.className = "search-history-clear";
		clear.type = "button";
		clear.textContent = "Clear";
		clear.onclick = clearSearchHistory;
		heading.appendChild(title);
		heading.appendChild(clear);
		el.appendChild(heading);

		var chips = document.createElement("div");
		chips.className = "search-history-chips";
		list.forEach(function (entry) {
			var chip = document.createElement("span");
			chip.className = "search-history-chip";
			chip.appendChild(document.createTextNode(entry.q));
			if (entry.scope && entry.scope !== "whole") {
				var meta = document.createElement("span");
				meta.className = "search-history-meta";
				meta.textContent = " \u00b7 " + scopeLabel(entry.scope);
				chip.appendChild(meta);
			}
			if (entry.mode === "words") {
				var wmeta = document.createElement("span");
				wmeta.className = "search-history-meta";
				wmeta.textContent = " \u00b7 each word";
				chip.appendChild(wmeta);
			}
			if (entry.partial !== false) {
				var pmeta = document.createElement("span");
				pmeta.className = "search-history-meta";
				pmeta.textContent = " \u00b7 partial";
				chip.appendChild(pmeta);
			}
			chip.onclick = (function (entry) {
				return function () {
					inputEl.value = entry.q;
					if (
						[].some.call(
							scopeSelect.options,
							(o) => o.value === entry.scope
						)
					)
						scopeSelect.value = entry.scope;
					setMode(entry.mode || "phrase");
					setPartial(entry.partial !== false);
					runSearch(entry.q, true);
				};
			})(entry);
			chips.appendChild(chip);
		});
		el.appendChild(chips);
	}

	renderSearchHistory();

	function openVerse(rec) {
		var book = books.find((b) => b.slug === rec[0]);
		if (!book) return;
		if (lastSearch) recordSearch(lastSearch);
		var results = window.searchResults || [];
		var idx = results.indexOf(rec);
		if (idx < 0) {
			// Fall back to a matching entry if the reference is not the same object.
			for (var i = 0; i < results.length; i++) {
				if (
					results[i][0] === rec[0] &&
					results[i][1] === rec[1] &&
					results[i][2] === rec[2]
				) {
					idx = i;
					break;
				}
			}
		}
		window.currentSearchResultIndex = idx;
		window.currentSearchResultVerse = rec[2];
		window.scrollVerse = rec[2];
		window.pendingHighlight = searchHighlight(lastSearch);
		loadThisChapter(book.name, book.slug, rec[1]);
	}

	// The chapter marks the words this result was found by, matched the same way
	// they were matched here: each word separately or the whole phrase, and on
	// whole words only when Partial is off.
	function searchHighlight(search) {
		if (!search || !search.q) return null;
		var terms =
			search.mode === "words"
				? search.q.split(/\s+/).filter(Boolean)
				: [search.q];
		if (!terms.length) return null;
		return {
			terms: terms,
			partial: search.partial !== false,
			label: "“" + search.q + "”",
		};
	}
</script>
