<p class="hdg">A Call for All Nations to Praise the LORD</p>
<p><span class="reftext" id="v1">1</span>Praise <span class="lord" data-name="the LORD">the LORD</span>, all nations; extol Him, all peoples. <span class="reftext" id="v2">2</span>For great is His steadfast love toward us, and the faithfulness of <span class="lord" data-name="the LORD">the LORD</span> endures forever. Praise <span class="lord" data-name="the LORD">the LORD</span>!</p>
