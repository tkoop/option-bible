<p class="hdg">A Call to Bless the Lord by Night</p>
<p><span class="reftext" id="v1">1</span> A song of ascents: Look, bless <span class="lord" data-name="the LORD">the LORD</span>, all <span class="youpl" data-word="you">you</span> servants of <span class="lord" data-name="the LORD">the LORD</span> who stand night watch in the house of <span class="lord" data-name="the LORD">the LORD</span>.</p>
<p><span class="reftext" id="v2">2</span> Lift up <span class="youpl" data-word="your">your</span> hands toward the sanctuary and bless <span class="lord" data-name="the LORD">the LORD</span>.</p>
<p><span class="reftext" id="v3">3</span> May <span class="lord" data-name="the LORD">the LORD</span>, Maker of heaven and earth, bless <span class="yousg" data-word="you">you</span> from Zion.</p>
</div>
