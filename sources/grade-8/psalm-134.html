<p class="hdg">Praise the LORD in His House</p>
<p><span class="reftext" id="v1">1</span> Look! Praise <span class="lord" data-name="the LORD">the LORD</span>, all servants of <span class="lord" data-name="the LORD">the LORD</span> who stand in the house of <span class="lord" data-name="the LORD">the LORD</span> at night.</p>
<p><span class="reftext" id="v2">2</span> Lift up <span class="youpl" data-word="your">your</span> hands in the holy place and bless <span class="lord" data-name="the LORD">the LORD</span>.</p>
<p><span class="reftext" id="v3">3</span> <span class="lord" data-name="The LORD">The LORD</span>, who made heaven and earth, bless <span class="yousg" data-word="you">you</span> from Zion.</p>
