<p class="hdg">Praise God at Night</p>
<p><span class="reftext" id="v1">1</span> Look! All <span class="youpl" data-word="you">you</span> servants of <span class="lord" data-name="the LORD">the LORD</span>, praise <span class="lord" data-name="the LORD">the LORD</span> at night in His house. <span class="reftext" id="v2">2</span> Lift up <span class="youpl" data-word="your">your</span> hands in the holy place and bless <span class="lord" data-name="the LORD">the LORD</span>. <span class="reftext" id="v3">3</span> May <span class="lord" data-name="The LORD">The LORD</span> bless <span class="yousg" data-word="you">you</span> from Zion. He made heaven and earth.</p>
