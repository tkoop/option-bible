<p class="hdg">A Universal Summons to Praise the LORD</p>
<p><span class="reftext" id="v1">1</span>Praise <span class="lord" data-name="the LORD">the LORD</span>, all nations; extol Him, all peoples. <span class="reftext" id="v2">2</span>For His steadfast love has prevailed over us, and the truth of <span class="lord" data-name="the LORD">the LORD</span> endures forever. Praise <span class="lord" data-name="the LORD">the LORD</span>.</p>
