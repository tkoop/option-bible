<p class="hdg">A Nocturnal summons to Blessing and Divine Benediction</p>
<p><span class="reftext" id="v1">1</span>Behold, bless <span class="lord" data-name="the LORD">the LORD</span>, all <span class="youpl" data-word="you">you</span> servants of <span class="lord" data-name="the LORD">the LORD</span> who keep nocturnal vigil in the house of <span class="lord" data-name="the LORD">the LORD</span>. <span class="reftext" id="v2">2</span>Lift up <span class="youpl" data-word="your">your</span> hands in the sanctuary and bless <span class="lord" data-name="the LORD">the LORD</span>. <span class="reftext" id="v3">3</span>May <span class="lord" data-name="the LORD">the LORD</span> bless <span class="yousg" data-word="you">you</span> from Zion—He who fashioned heaven and earth.</p>
